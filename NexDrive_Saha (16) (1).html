<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1d2b">
<meta name="application-name" content="NexDrive Saha">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NexDrive Saha</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1d2b'/%3E%3Cpath d='M16 46V18h6l14 18V18h6v28h-6L22 28v18z' fill='%23e9f2f7'/%3E%3Cpath d='M40 18l10 14-10 14' stroke='%233fc1c6' stroke-width='5' fill='none'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f6f9;--p1:#ffffff;--p2:#f7f9fb;--ln:#dfe6ec;--ln2:#c9d4dd;--tx:#13202b;--mu:#5b6f7c;--nav:#0d1d2b;--nav2:#132a3d;--navtx:#cfdde7;--ac:#119ea4;--ac2:#3fc1c6;--acbg:#e3f6f7;--am:#d98a14;--ambg:#fdf3e2;--rd:#d93a4a;--rdbg:#fde8ea;--gr:#1f9d61;--grbg:#e4f6ed;--sh:0 1px 2px rgba(16,32,48,.06),0 6px 20px rgba(16,32,48,.06);--fh:'Bahnschrift','DIN Alternate','Segoe UI',system-ui,sans-serif;--fb:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--fm:'Cascadia Code',Consolas,monospace}
:root[data-tema="koyu"]{--bg:#081521;--p1:#0d1d2b;--p2:#112638;--ln:#1f3a52;--ln2:#2a4a66;--tx:#e3edf3;--mu:#86a0b3;--acbg:rgba(63,193,198,.12);--ambg:rgba(240,166,58,.12);--rdbg:rgba(255,93,108,.12);--grbg:rgba(57,217,138,.12);--ac:#3fc1c6;--am:#f0a63a;--rd:#ff5d6c;--gr:#39d98a;--sh:none}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--fb)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--ac)}
/* ---- uygulama iskeleti ---- */
#uyg{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
#yan{background:var(--nav);color:var(--navtx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
#yan .mk{padding:18px 16px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
#yan .mk svg{height:26px;display:block}#yan .mk small{display:block;margin-top:6px;font:600 10px var(--fh);letter-spacing:.2em;color:#7fa3b8}
#yan .fr{padding:12px 16px;font-weight:600;color:#fff;font-size:13px;border-bottom:1px solid rgba(255,255,255,.07)}#yan .fr small{display:block;color:#7fa3b8;font-weight:400;font-size:11px}
#yan nav{padding:8px;flex:1}
#yan .gb{font:600 10px var(--fh);letter-spacing:.16em;color:#6f8ea3;padding:12px 10px 4px}
#yan a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--navtx);text-decoration:none;font-size:13.5px}
#yan a:hover{background:var(--nav2)}#yan a.on{background:rgba(63,193,198,.16);color:#fff;box-shadow:inset 3px 0 0 var(--ac2)}
#yan a i{font-style:normal;width:18px;text-align:center;opacity:.9}#yan a b{margin-left:auto;font:600 11px var(--fb);background:var(--rd);color:#fff;border-radius:999px;padding:0 7px}
#yan .alt{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6f8ea3}#yan .alt svg{height:14px;vertical-align:-2px}
#ana{min-width:0;display:flex;flex-direction:column}
#ust{position:sticky;top:0;z-index:5;background:var(--p1);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:10px 22px;min-height:56px}
#ust h1{font:600 18px var(--fh);margin:0;letter-spacing:.01em}#ust .sp{flex:1}
#ust .dur{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mu);padding:5px 10px;border:1px solid var(--ln);border-radius:999px;cursor:pointer;white-space:nowrap}
.led{width:8px;height:8px;border-radius:50%;background:var(--mu)}.led.g{background:var(--gr)}.led.a{background:var(--am)}.led.r{background:var(--rd)}.led.c{background:var(--ac);animation:nb 1s infinite}@keyframes nb{50%{opacity:.3}}
#icerik{padding:20px 22px 60px;max-width:1500px;width:100%}
#menuBtn{display:none}
/* ---- bileşenler ---- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln2);background:var(--p1);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{filter:brightness(1.07)}.btn.r{color:var(--rd);border-color:color-mix(in srgb,var(--rd) 40%,transparent)}.btn.k{padding:4px 9px;font-size:12.5px}.btn:disabled{opacity:.5;cursor:default}
.kart{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.kart h3{margin:0 0 10px;font:600 14px var(--fh);letter-spacing:.02em}
.izg{display:grid;gap:14px}.i4{grid-template-columns:repeat(4,minmax(0,1fr))}.i3{grid-template-columns:repeat(3,minmax(0,1fr))}.i2{grid-template-columns:repeat(2,minmax(0,1fr))}.i21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;box-shadow:var(--sh);border-left:4px solid var(--ac)}
.kpi small{display:block;color:var(--mu);font-size:12px}.kpi b{display:block;font:600 22px var(--fh);margin:4px 0 2px;letter-spacing:.01em}.kpi span{font-size:12px;color:var(--mu)}
.kpi.a{border-left-color:var(--am)}.kpi.r{border-left-color:var(--rd)}.kpi.g{border-left-color:var(--gr)}
.ara{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.ara label{display:grid;gap:3px;font-size:12px;color:var(--mu)}
input,select,textarea{background:var(--p1);border:1px solid var(--ln2);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 35%,transparent);border-color:var(--ac)}
.tw{overflow:auto;border:1px solid var(--ln);border-radius:10px;background:var(--p1)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--p2);text-align:left;font-weight:600;color:var(--mu);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;cursor:pointer;user-select:none}
table.t td{padding:7px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}table.t tbody tr:hover td{background:var(--p2)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:700;background:var(--p2);border-top:2px solid var(--ln)}
.et{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--p2);color:var(--mu);border:1px solid var(--ln)}
.et.g{background:var(--grbg);color:var(--gr);border-color:transparent}.et.a{background:var(--ambg);color:var(--am);border-color:transparent}.et.r{background:var(--rdbg);color:var(--rd);border-color:transparent}.et.c{background:var(--acbg);color:var(--ac);border-color:transparent}
.bas{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bas h2{margin:0;font:600 16px var(--fh)}.bas .sp{flex:1}
.sekme{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:14px;overflow-x:auto}
.sekme a{padding:8px 14px;text-decoration:none;color:var(--mu);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}.sekme a.on{color:var(--ac);border-bottom-color:var(--ac)}
.bos{text-align:center;color:var(--mu);padding:30px 10px}.bos b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
.uyari{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;margin-bottom:6px;font-size:13px;background:var(--p2);border:1px solid var(--ln)}
.uyari.r{background:var(--rdbg);border-color:transparent}.uyari.a{background:var(--ambg);border-color:transparent}.uyari i{font-style:normal}
.cubuk{height:8px;border-radius:99px;background:var(--p2);overflow:hidden;border:1px solid var(--ln)}.cubuk>span{display:block;height:100%;background:var(--ac)}
.not{color:var(--mu);font-size:12.5px}
/* ---- pencere ---- */
#pen{position:fixed;inset:0;background:rgba(10,22,34,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 14px;overflow:auto}
#pen .kutu{background:var(--p1);border-radius:14px;width:min(720px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
#pen .pb{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--ln);font:600 16px var(--fh)}#pen .pb span{flex:1}
#pen .pi{padding:16px 18px}#pen .pa{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--ln)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--mu)}.form label.tam{grid-column:1/-1}.form .ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}.form .ck input{width:18px;height:18px}
#bil{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}
/* ---- giriş ---- */
#giris{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 30% 20%,#173149,#081521 70%)}
#giris .kutu{background:var(--p1);border-radius:16px;padding:28px;width:min(420px,100%);box-shadow:0 30px 80px rgba(0,0,0,.4)}
#giris .kutu svg.lg{height:34px;display:block;margin-bottom:6px}
/* ---- saha (telefon) ---- */
#saha{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}
#saha .sb{background:var(--nav);color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top,0));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
#saha .sb svg{height:20px}#saha .sb .sp{flex:1}#saha .sb small{display:block;color:#7fa3b8;font-size:11px}
#saha .ic{padding:14px}
.karo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.karo button{border:0;border-radius:16px;padding:20px 14px;min-height:118px;font:600 17px var(--fh);color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;cursor:pointer;box-shadow:var(--sh);text-align:left}
.karo button i{font-style:normal;font-size:30px;line-height:1}.karo button small{font:400 12px var(--fb);opacity:.85}
.sf label{display:grid;gap:5px;font-size:13px;color:var(--mu);margin-bottom:12px}.sf input,.sf select,.sf textarea{font-size:17px;padding:12px;border-radius:10px}
.sf .buyuk{width:100%;padding:16px;font:600 18px var(--fh);border-radius:12px}
.secim{display:flex;flex-wrap:wrap;gap:8px}.secim button{flex:1 1 auto;min-width:72px;padding:12px 10px;border-radius:10px;border:1px solid var(--ln2);background:var(--p1);font-weight:600;cursor:pointer}.secim button.on{background:var(--ac);border-color:var(--ac);color:#fff}
/* ---- yazdırma ---- */
@media print{#yan,#ust,.yok-yaz{display:none!important}#icerik{padding:0}}
/* ---- dar ekran ---- */
@media (max-width:980px){.i4{grid-template-columns:repeat(2,minmax(0,1fr))}.i3,.i21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
 #uyg{grid-template-columns:minmax(0,1fr)}#yan{position:fixed;z-index:40;width:250px;transform:translateX(-100%);transition:transform .2s}#yan.ac{transform:none;box-shadow:0 0 50px rgba(0,0,0,.5)}
 #menuBtn{display:inline-flex}#ust{padding:8px 12px}#ust h1{font-size:16px}#icerik{padding:14px 12px 60px}
 .i2{grid-template-columns:minmax(0,1fr)}.form{grid-template-columns:minmax(0,1fr)}.kpi b{font-size:19px}#ust .dur span{display:none}
}
</style>
</head>

<div id="bil"></div>

const SAHA_GORUNUM = {araclar: 'saha_araclar', santiyeler: 'saha_santiyeler'};

const PKAD = s => String(s || '').trim().toLocaleLowerCase('tr').replace(/[çğıöşü]/g, c => ({ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u'}[c])).replace(/\s+/g, '.').replace(/[^a-z0-9._-]/g, '').replace(/\.{2,}/g, '.').replace(/^\.|\.$/g, '');
const PEPOSTA = k => String(k || '').includes('@') ? String(k).trim().toLowerCase() : PKAD(k) + '@' + PERSONEL_ALAN;
const SHA256 = m => {
  const K = [], H = []; let n = 2, c = 0; const f = x => (x - Math.floor(x)) * 4294967296 | 0;
  while (c < 64) {let p = true; for (let i = 2; i * i <= n; i++) if (n % i == 0) {p = false; break} if (p) {if (c < 8) H[c] = f(Math.pow(n, 1 / 2)); K[c++] = f(Math.pow(n, 1 / 3))} n++}
  const b = [...new TextEncoder().encode(m)], l = b.length * 8; b.push(0x80); while (b.length % 64 != 56) b.push(0); for (let i = 7; i >= 0; i--) b.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
  const r = (x, y) => (x >>> y) | (x << (32 - y));
  for (let j = 0; j < b.length; j += 64) {
    const w = []; for (let i = 0; i < 16; i++) w[i] = b[j + 4 * i] << 24 | b[j + 4 * i + 1] << 16 | b[j + 4 * i + 2] << 8 | b[j + 4 * i + 3];
    for (let i = 16; i < 64; i++) {const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0}
    let [a, bb, cc, d, e, ff, g, h] = H;
    for (let i = 0; i < 64; i++) {const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & ff) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & cc) ^ (bb & cc))) | 0; h = g; g = ff; ff = e; e = (d + t1) | 0; d = cc; cc = bb; bb = a; a = (t1 + t2) | 0}
    [a, bb, cc, d, e, ff, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
};
const PHASH = (kad, parola) => SHA256('nxsaha|' + kad + '|' + parola);


/* Supabase SQL üretici (build.js tarafından kullanılır) */
const SEMA_SQL = () => {
  const tip = {text: 'text', numeric: 'numeric', int: 'integer', date: 'date', uuid: 'uuid', bool: 'boolean', jsonb: 'jsonb'};
  let s = `-- NexDrive Saha · Supabase kurulum betiği\n-- NexDrive Engineering · Supabase panelinde SQL Editor'a yapıştırıp bir kez çalıştırın.\n-- Betik tekrar çalıştırılabilir (idempotent).\n\n`;
  s += `create table if not exists public.kullanicilar (\n  id uuid primary key references auth.users(id) on delete cascade,\n  ad text,\n  eposta text,\n  rol text not null default 'beklemede' check (rol in ('yonetici','ofis','saha','beklemede')),\n  personel_id uuid,\n  olusturma timestamptz not null default now(),\n  guncelleme timestamptz not null default now(),\n  silindi boolean not null default false\n);\n\n`;
  s += `-- Oturum açan kullanıcının rolü (RLS politikalarında kullanılır)\ncreate or replace function public.nx_rol() returns text\nlanguage sql stable security definer set search_path = public as $$\n  select rol from public.kullanicilar where id = auth.uid() and not silindi\n$$;\n\n`;
  s += `-- Oturum açan kullanıcının eşlendiği personel kartı (saha kendi adına girilen kayıtları görür)\ncreate or replace function public.nx_personel() returns uuid\nlanguage sql stable security definer set search_path = public as $$\n  select personel_id from public.kullanicilar where id = auth.uid() and not silindi\n$$;\n\n`;
  s += `-- Personel paneli hesabı: yönetici kullanıcı adı / parola belirler (pgcrypto)\ncreate extension if not exists pgcrypto with schema extensions;\ncreate or replace function public.nx_personel_hesap(p_personel uuid, p_eposta text, p_parola text, p_ad text) returns uuid\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare u uuid; r text;\nbegin\n  if public.nx_rol() is distinct from 'yonetici' then raise exception 'Parolayı yalnızca yönetici belirleyebilir'; end if;\n  p_eposta := lower(trim(p_eposta));\n  select id into u from public.kullanicilar where personel_id = p_personel and not silindi limit 1;\n  if u is null then select id into u from auth.users where lower(email) = p_eposta limit 1; end if;\n  if u is null then\n    if coalesce(p_parola,'') = '' then raise exception 'Yeni hesap için parola girin'; end if;\n    if exists (select 1 from auth.users where lower(email) = p_eposta) then raise exception 'Bu kullanıcı adı başka bir hesapta kullanılıyor'; end if;\n    u := gen_random_uuid();\n    -- e-posta doğrulaması gönderilmez: hesap doğrudan onaylı açılır\n    insert into auth.users (instance_id, id, aud, role, email, encrypted_password, email_confirmed_at, raw_app_meta_data, raw_user_meta_data, created_at, updated_at, confirmation_token, recovery_token, email_change, email_change_token_new, email_change_token_current, reauthentication_token)\n      values ('00000000-0000-0000-0000-000000000000', u, 'authenticated', 'authenticated', p_eposta, crypt(p_parola, gen_salt('bf')), now(), '{"provider":"email","providers":["email"]}'::jsonb, jsonb_build_object('ad', p_ad), now(), now(), '', '', '', '', '', '');\n    insert into auth.identities (id, user_id, provider_id, identity_data, provider, last_sign_in_at, created_at, updated_at)\n      values (gen_random_uuid(), u, u::text, jsonb_build_object('sub', u::text, 'email', p_eposta, 'email_verified', true), 'email', now(), now(), now());\n  end if;\n  select rol into r from public.kullanicilar where id = u;\n  if r in ('yonetici','ofis') then raise exception 'Bu kullanıcı adı bir ofis / yönetici hesabına ait'; end if;\n  if exists (select 1 from auth.users where lower(email) = p_eposta and id <> u) then raise exception 'Bu kullanıcı adı başka bir hesapta kullanılıyor'; end if;\n  update auth.users set email = p_eposta, encrypted_password = case when coalesce(p_parola,'') <> '' then crypt(p_parola, gen_salt('bf')) else encrypted_password end, email_confirmed_at = coalesce(email_confirmed_at, now()), confirmation_token = '', updated_at = now() where id = u;\n  update auth.identities set identity_data = identity_data || jsonb_build_object('email', p_eposta, 'email_verified', true) where user_id = u and provider = 'email';\n  insert into public.kullanicilar(id, ad, eposta, rol, personel_id) values (u, p_ad, p_eposta, 'saha', p_personel)\n    on conflict (id) do update set ad = excluded.ad, eposta = excluded.eposta, rol = 'saha', personel_id = excluded.personel_id, silindi = false;\n  update public.kullanicilar set personel_id = null where personel_id = p_personel and id <> u;\n  return u;\nend $$;\n\n`;
  s += `-- İlk girişte kullanıcı kaydı: hiç yönetici yoksa ilk kullanıcı yönetici olur, diğerleri onay bekler\ncreate or replace function public.nx_giris(p_ad text) returns text\nlanguage plpgsql security definer set search_path = public as $$\ndeclare r text;\nbegin\n  if auth.uid() is null then raise exception 'oturum yok'; end if;\n  select rol into r from public.kullanicilar where id = auth.uid();\n  if r is not null then return r; end if;\n  if not exists (select 1 from public.kullanicilar where rol = 'yonetici' and not silindi) then r := 'yonetici'; else r := 'beklemede'; end if;\n  insert into public.kullanicilar(id, ad, eposta, rol) values (auth.uid(), p_ad, (select email from auth.users where id = auth.uid()), r);\n  return r;\nend $$;\n\n`;
  s += `create or replace function public.nx_guncelleme() returns trigger language plpgsql as $$\nbegin new.guncelleme := now(); return new; end $$;\n\n`;
  for (const [t, d] of Object.entries(SEMA)) {
    s += `create table if not exists public.${t} (\n  id uuid primary key default gen_random_uuid(),\n  olusturan uuid default auth.uid(),\n  olusturma timestamptz not null default now(),\n  guncelleme timestamptz not null default now(),\n  silindi boolean not null default false`;
    for (const [k, v] of Object.entries(d.alan)) s += `,\n  ${k} ${tip[v]}`;
    s += `\n);\n`;
    for (const [k, v] of Object.entries(d.alan)) s += `alter table public.${t} add column if not exists ${k} ${tip[v]};\n`;
    s += `create index if not exists ${t}_guncelleme_ix on public.${t}(guncelleme);\n`;
    if (d.alan.tarih) s += `create index if not exists ${t}_tarih_ix on public.${t}(tarih);\n`;
    s += `drop trigger if exists ${t}_guncelleme_tg on public.${t};\ncreate trigger ${t}_guncelleme_tg before update on public.${t} for each row execute function public.nx_guncelleme();\n`;
    s += `alter table public.${t} enable row level security;\n`;
    ['oku', 'ekle', 'guncelle'].forEach(p => s += `drop policy if exists ${t}_${p} on public.${t};\n`);
    if (d.yetki == 'ref') s += `create policy ${t}_oku on public.${t} for select to authenticated using (${t == 'personel' ? `public.nx_rol() in ('yonetici','ofis') or (public.nx_rol() = 'saha' and id = public.nx_personel())` : SAHA_GORUNUM[t] || SAHA_KAPALI.includes(t) ? `public.nx_rol() in ('yonetici','ofis')` : `public.nx_rol() in ('yonetici','ofis','saha')`});\ncreate policy ${t}_ekle on public.${t} for insert to authenticated with check (public.nx_rol() in ('yonetici','ofis'));\ncreate policy ${t}_guncelle on public.${t} for update to authenticated using (public.nx_rol() in ('yonetici','ofis'));\n`;
    if (d.yetki == 'saha') s += `create policy ${t}_oku on public.${t} for select to authenticated using (public.nx_rol() in ('yonetici','ofis') or (public.nx_rol() = 'saha' and (olusturan = auth.uid()${d.alan.personel_id ? ' or personel_id = public.nx_personel()' : d.alan.bildiren_id ? ' or bildiren_id = public.nx_personel()' : ''})));\ncreate policy ${t}_ekle on public.${t} for insert to authenticated with check (public.nx_rol() in ('yonetici','ofis') or (public.nx_rol() = 'saha' and olusturan = auth.uid()));\ncreate policy ${t}_guncelle on public.${t} for update to authenticated using (public.nx_rol() in ('yonetici','ofis') or (public.nx_rol() = 'saha' and olusturan = auth.uid()));\n`;
    if (d.yetki == 'ortak') s += `create policy ${t}_oku on public.${t} for select to authenticated using (public.nx_rol() in ('yonetici','ofis','saha'));\ncreate policy ${t}_ekle on public.${t} for insert to authenticated with check (public.nx_rol() in ('yonetici','ofis','saha'));\ncreate policy ${t}_guncelle on public.${t} for update to authenticated using (public.nx_rol() in ('yonetici','ofis'));\n`;
    if (d.yetki == 'ofis') s += `create policy ${t}_oku on public.${t} for select to authenticated using (public.nx_rol() in ('yonetici','ofis'));\ncreate policy ${t}_ekle on public.${t} for insert to authenticated with check (public.nx_rol() in ('yonetici','ofis'));\ncreate policy ${t}_guncelle on public.${t} for update to authenticated using (public.nx_rol() in ('yonetici','ofis'));\n`;
    s += `\n`;
  }
  s += `-- Saha rolü fiyat görmez: araç ve iş listeleri ücret sütunları olmadan bu görünümlerden okunur\n`;
  for (const [t, g] of Object.entries(SAHA_GORUNUM)) {
    const kol = [...SEMA_ORTAK, ...Object.keys(SEMA[t].alan).filter(k => !(SAHA_GIZLI_ALAN[t] || []).includes(k))];
    s += `drop view if exists public.${g};\ncreate view public.${g} as select ${kol.join(', ')} from public.${t} where public.nx_rol() in ('yonetici','ofis','saha');\nrevoke all on public.${g} from anon;\ngrant select on public.${g} to authenticated;\n\n`;
  }
  s += `-- kullanıcılar tablosu\ncreate index if not exists kullanicilar_guncelleme_ix on public.kullanicilar(guncelleme);\ndrop trigger if exists kullanicilar_guncelleme_tg on public.kullanicilar;\ncreate trigger kullanicilar_guncelleme_tg before update on public.kullanicilar for each row execute function public.nx_guncelleme();\nalter table public.kullanicilar enable row level security;\ndrop policy if exists kullanicilar_oku on public.kullanicilar;\ndrop policy if exists kullanicilar_guncelle on public.kullanicilar;\ncreate policy kullanicilar_oku on public.kullanicilar for select to authenticated using (id = auth.uid() or public.nx_rol() = 'yonetici');\ncreate policy kullanicilar_guncelle on public.kullanicilar for update to authenticated using (public.nx_rol() = 'yonetici');\n\n`;
  s += `-- Silme işlemi yapılmaz; kayıtlar "silindi" işaretlenir (çevrimdışı eşitleme için).\ngrant usage on schema public to authenticated;\ngrant select, insert, update on all tables in schema public to authenticated;\ngrant execute on function public.nx_rol() to authenticated;\ngrant execute on function public.nx_personel() to authenticated;\ngrant execute on function public.nx_personel_hesap(uuid, text, text, text) to authenticated;\ngrant execute on function public.nx_giris(text) to authenticated;\nrevoke all on all tables in schema public from anon;\n`;
  return s;
};


/* ===== NexDrive Saha · 10 · Veri katmanı: yerel depo (IndexedDB), çevrimdışı kuyruk, Supabase eşitleme ve oturum ===== */
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {const r = Math.random() * 16 | 0; return (c == 'x' ? r : (r & 3 | 8)).toString(16)}));
const simdi = () => new Date().toISOString();
const bugun = () => {const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10)};

const IDB = {
  db: null,
  ac() {return new Promise(res => {try {const r = indexedDB.open('nexdrive_saha', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => {IDB.db = r.result; res(true)}; r.onerror = r.onblocked = () => res(false)} catch (e) {res(false)}})},
  al(k) {return new Promise(res => {if (!IDB.db) return res(IDB.yedek(k)); try {const q = IDB.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined)} catch (e) {res(undefined)}})},
  yaz(k, v) {return new Promise(res => {if (!IDB.db) {IDB.yedekYaz(k, v); return res()} try {const tx = IDB.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = tx.onerror = () => res()} catch (e) {res()}})},
  temizle() {return new Promise(res => {if (!IDB.db) {try {Object.keys(localStorage).filter(k => k.startsWith('nxsaha:')).forEach(k => localStorage.removeItem(k))} catch (e) {} return res()} const tx = IDB.db.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = () => res()})},
  yedek(k) {try {const v = localStorage.getItem('nxsaha:' + k); return v ? JSON.parse(v) : undefined} catch (e) {return undefined}},
  yedekYaz(k, v) {try {localStorage.setItem('nxsaha:' + k, JSON.stringify(v))} catch (e) {}}
};

const VERI = {
  t: {}, ix: {}, kuyruk: new Set(), hatalar: [],
  ayar: {mod: 'yerel', url: '', anahtar: '', oturum: null, rol: 'yonetici', ad: 'Yerel kullanıcı', kullanici_id: null, imlec: {}, sonEsitleme: null, personel_id: ''},
  dinleyici: [], _kirli: new Set(), _zaman: 0,
  async hazirla() {
    await IDB.ac();
    const a = await IDB.al('ayar'); if (a) Object.assign(VERI.ayar, a);
    for (const t of [...Object.keys(SEMA), 'kullanicilar']) {const r = await IDB.al('t:' + t); VERI.t[t] = Array.isArray(r) ? r : []; VERI.ix[t] = new Map(VERI.t[t].map(x => [x.id, x]))}
    const k = await IDB.al('kuyruk'); VERI.kuyruk = new Set(Array.isArray(k) ? k : []);
    VERI.hatalar = (await IDB.al('hatalar')) || [];
  },
  bulut() {return VERI.ayar.mod == 'bulut' && VERI.ayar.url && VERI.ayar.anahtar},
  liste(t, silinmis = false) {return (VERI.t[t] || []).filter(r => silinmis || !r.silindi)},
  al(t, id) {return id ? VERI.ix[t] && VERI.ix[t].get(id) : null},
  ad(t, id, alan = 'ad') {const r = VERI.al(t, id); return r ? (r[alan] || r.kod || r.plaka || '') : ''},
  ayarlarSatiri() {return VERI.al('ayarlar', AYAR_ID) || {id: AYAR_ID, firma_adi: '', kdv_orani: 20, hakedis_onek: 'HK'}},
  /* tip dönüşümü: şemaya göre temiz satır */
  temiz(t, r) {
    const d = SEMA[t], o = {id: r.id, silindi: !!r.silindi, olusturan: r.olusturan || null, olusturma: r.olusturma || simdi()};
    for (const [k, v] of Object.entries(d.alan)) {
      let x = r[k];
      if (v == 'numeric' || v == 'int') x = x === '' || x == null || !isFinite(+x) ? null : (v == 'int' ? Math.round(+x) : +x);
      else if (v == 'uuid' || v == 'date') x = x ? String(x) : null;
      else if (v == 'bool') x = !!x;
      else if (v == 'jsonb') x = x == null || x === '' ? null : x;
      else x = x == null ? null : String(x);
      o[k] = x;
    }
    return o;
  },
  kaydet(t, r, sessiz) {
    const yeni = !r.id || !VERI.ix[t].has(r.id);
    const row = VERI.temiz(t, {...(yeni ? {} : VERI.ix[t].get(r.id)), ...r, id: r.id || uuid()});
    if (yeni) {row.olusturan = row.olusturan || VERI.ayar.kullanici_id; row.olusturma = simdi()}
    row.guncelleme = simdi(); row._yerel = 1;
    if (VERI.ix[t].has(row.id)) {const i = VERI.t[t].findIndex(x => x.id == row.id); VERI.t[t][i] = row} else VERI.t[t].push(row);
    VERI.ix[t].set(row.id, row);
    if (VERI.bulut()) VERI.kuyruk.add(t + '|' + row.id);
    VERI.kirli(t); if (!sessiz) VERI.yay(t);
    return row;
  },
  sil(t, id) {const r = VERI.al(t, id); if (r) VERI.kaydet(t, {...r, silindi: true})},
  toplu(t, satirlar) {satirlar.forEach(r => VERI.kaydet(t, r, true)); VERI.yay(t)},
  kirli(t) {VERI._kirli.add(t); clearTimeout(VERI._zaman); VERI._zaman = setTimeout(VERI.diskeYaz, 400)},
  async diskeYaz() {const k = [...VERI._kirli].filter(t => VERI.t[t]); VERI._kirli.clear(); for (const t of k) await IDB.yaz('t:' + t, VERI.t[t]); await IDB.yaz('kuyruk', [...VERI.kuyruk]); await IDB.yaz('ayar', VERI.ayar); await IDB.yaz('hatalar', VERI.hatalar)},
  ayarKaydet() {return IDB.yaz('ayar', VERI.ayar)},
  dinle(fn) {VERI.dinleyici.push(fn)},
  yay(t) {VERI.dinleyici.forEach(f => {try {f(t)} catch (e) {console.error(e)}})},
  async tumunuSil() {await IDB.temizle(); for (const t of Object.keys(VERI.t)) {VERI.t[t] = []; VERI.ix[t] = new Map()} VERI.kuyruk.clear(); VERI.hatalar = []; VERI.ayar.imlec = {}},
  disaAktar() {const o = {surum: 1, tarih: simdi(), tablolar: {}}; for (const t of Object.keys(SEMA)) o.tablolar[t] = VERI.t[t]; return o},
  birlestir(o) {for (const t of Object.keys(SEMA)) {if (t == 'ayarlar') continue; (o.tablolar[t] || []).forEach(r => VERI.kaydet(t, r, true))} VERI.yay('*')},
  async iceAktar(o) {if (!o || !o.tablolar) throw new Error('Geçersiz yedek dosyası'); for (const t of Object.keys(SEMA)) {const L = (o.tablolar[t] || []).map(r => VERI.temiz(t, r)).map(r => ({...r, guncelleme: simdi()})); VERI.t[t] = L; VERI.ix[t] = new Map(L.map(x => [x.id, x])); if (VERI.bulut()) L.forEach(r => VERI.kuyruk.add(t + '|' + r.id)); VERI._kirli.add(t)} await VERI.diskeYaz(); VERI.yay('*')}
};

const BULUT = {
  durum: 'yerel', calisiyor: false, sonHata: '', eksik: [],
  async istek(yol, o = {}, tekrar = true) {
    const A = VERI.ayar; if (!navigator.onLine) throw new Error('çevrimdışı');
    if (A.oturum && A.oturum.exp && Date.now() / 1000 > A.oturum.exp - 60 && yol.indexOf('/auth/') < 0) await BULUT.yenile();
    const h = {apikey: A.anahtar, 'Content-Type': 'application/json', ...(o.headers || {})};
    if (A.oturum && A.oturum.access) h.Authorization = 'Bearer ' + A.oturum.access;
    const r = await fetch(A.url.replace(/\/+$/, '') + yol, {method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined});
    if (r.status == 401 && tekrar && A.oturum && A.oturum.refresh && yol.indexOf('/auth/') < 0) {await BULUT.yenile(); return BULUT.istek(yol, o, false)}
    const metin = await r.text(); let veri = null; try {veri = metin ? JSON.parse(metin) : null} catch (e) {veri = metin}
    if (!r.ok) {const m = veri && (veri.message || veri.msg || veri.error_description || veri.error) || ('HTTP ' + r.status); const e = new Error(m); e.durum = r.status; throw e}
    return veri;

/* bulut modunda personel paneli hesabı (Supabase kullanıcısı) aç / parolasını değiştir */
const PANELHESAP = {
  async kur(p, pw) {
    const ep = PEPOSTA(p.kullanici_adi), rpc = () => BULUT.istek('/rest/v1/rpc/nx_personel_hesap', {method: 'POST', body: {p_personel: p.id, p_eposta: ep, p_parola: pw, p_ad: p.ad}});
    UI.bildir('Panel hesabı hazırlanıyor…', 8000);
    try {
      const id = await rpc(); if (!id) throw new Error('hesap oluşturulamadı');
      UI.bildir(`✓ ${p.ad}: panel girişi hazır · kullanıcı adı “${p.kullanici_adi}”`, 6000); BULUT.esitle(true);
    } catch (e) {UI.bildir('Panel hesabı kurulamadı: ' + (/nx_personel_hesap|could not find|schema cache/i.test(e.message) ? 'Supabase kurulum betiğini yeniden çalıştırın (Ayarlar → Bulut)' : e.message), 8000)}
  }
};

/* dönem filtresi */
const DONEM = {

  hesap(k) {const b = bugun(); switch (k) {case 'bugun': return [b, b]; case 'dun': {const d = gunEkle(b, -1); return [d, d]} case 'hafta': {const g = (new Date(b + 'T12:00:00').getDay() + 6) % 7; return [gunEkle(b, -g), b]} case 'ay': return [ayBasi(b), b]; case 'gecenay': {const s = gunEkle(ayBasi(b), -1); return [ayBasi(s), s]} case 'son30': return [gunEkle(b, -29), b]; case 'yil': return [b.slice(0, 4) + '-01-01', b]} return null},
  st(vars = 'ay') {const k = UI.aktif + ':donem'; if (!UI.hal[k]) {const [bas, bit] = DONEM.hesap(vars); UI.hal[k] = {k: vars, bas, bit}} return UI.hal[k]},
  html(st) {return `<label>Dönem<select class="dk">${Object.entries(DONEM.hazir).map(([k, v]) => `<option value="${k}"${st.k == k ? ' selected' : ''}>${v}</option>`).join('')}</select></label><label>Başlangıç<input type="date" class="db" value="${st.bas}"></label><label>Bitiş<input type="date" class="de" value="${st.bit}"></label>`},
  bagla(el, st, fn) {const k = $('.dk', el), b = $('.db', el), e = $('.de', el); k.onchange = () => {st.k = k.value; const r = DONEM.hesap(k.value); if (r) [st.bas, st.bit] = r; fn()}; b.onchange = e.onchange = () => {st.k = 'ozel'; st.bas = b.value; st.bit = e.value; fn()}}

  /* hakedişe bağlanmamış iş: şantiyenin son hakediş dönemi sonrasındaki seferler + makine saatleri */
  bekleyenIs() {
    const S = VERI.liste('seferler'), P = VERI.liste('puantaj');
    return VERI.liste('santiyeler').map(st => {
      const son = VERI.liste('hakedis').filter(h => h.santiye_id == st.id && h.durum != 'iptal').reduce((m, h) => h.donem_bit > m ? h.donem_bit : m, '');
      const s = S.filter(x => x.santiye_id == st.id && x.tarih > son), p = P.filter(x => x.santiye_id == st.id && x.tarih > son && x.arac_id);
      const saat = p.reduce((t, x) => t + HESAP.calismaSaat(x), 0), tutar = p.reduce((t, x) => t + HESAP.calismaGelir(x), 0) + s.reduce((t, x) => t + HESAP.seferGelir(x), 0);
      const tarihler = [...s, ...p].map(x => x.tarih).sort();
      return {st, son, sefer: s.length, saat, tutar, bas: tarihler[0] || '', bit: tarihler[tarihler.length - 1] || ''};
    }).filter(x => x.saat > 0 || x.sefer);
  },
  uyarilar() {
    const U = [];
    VERI.liste('araclar').filter(a => a.durum != 'satildi').forEach(a => {const b = HESAP.bakimDurum(a), birim = a.sayac_tipi == 'saat' ? 'saat' : 'km';

      else if (b.durum == 'yakin') U.push(['a', '🔧', `<b>${esc(a.kod)}</b> bakımına ${sayi(b.kalan)} ${birim} kaldı`, 'makineler'])});
    const sinir = gunEkle(bugun(), -14);
    Object.values(HESAP.yakitAnaliz()).forEach(y => {const s = y.aralik[y.aralik.length - 1]; if (s && s.anomali && s.y.tarih >= sinir) U.push(['a', '⛽', `<b>${esc(y.arac.kod)}</b> son dolumda ${sayi(s.oran, 1)} ${y.birim} tüketti (normali ${sayi(y.med, 1)}, %${sayi((s.oran / y.med - 1) * 100)} fazla)`, 'yakit/verim'])});
    VERI.liste('musteriler').forEach(m => HESAP.alacak(m.id).satir.filter(s => s.kalan > .005 && s.gecikme > 0).forEach(s => U.push(['r', '₺', `<b>${esc(s.h.no)}</b> · ${esc(m.ad)} · vadesi ${s.gecikme} gün geçti · kalan ${para(s.kalan)}`, 'alacak/' + m.id])));
    const tas = VERI.liste('hakedis').filter(h => h.durum == 'taslak').length; if (tas) U.push(['', '📄', `${tas} hakediş taslak durumda, onay bekliyor`, 'hakedis']);
    if (VERI.hatalar.length) U.push(['r', '⇅', `${VERI.hatalar.length} kayıt buluta gönderilemedi`, 'ayarlar/veri']);
    if (VERI.ayar.rol == 'yonetici') {const b = VERI.liste('kullanicilar').filter(k => k.rol == 'beklemede').length; if (b) U.push(['a', '👤', `${b} kullanıcı onay bekliyor`, 'ayarlar/kullanicilar'])}
    if (BULUT.eksik.length) U.push(['r', '⇅', 'Sunucu kurulum betiği eski — yükleme sahaları ve saatlik ücret için betiği yeniden çalıştırın', 'ayarlar/bulut']);
    const ucretsiz = VERI.liste('araclar').filter(a => a.durum == 'aktif' && ISMAKINESI(a.tip) && !N(a.saat_ucreti)).length; if (ucretsiz) U.push(['a', '₺', `${ucretsiz} aktif iş makinesinin saat ücreti girilmemiş — kazanç hesaplanamaz`, 'tanimlar/araclar']);
    return U;
  }
};

const yaziyla = tutar => {
  const B = ['', 'bir', 'iki', 'üç', 'dört', 'beş', 'altı', 'yedi', 'sekiz', 'dokuz'], O = ['', 'on', 'yirmi', 'otuz', 'kırk', 'elli', 'altmış', 'yetmiş', 'seksen', 'doksan'], G = ['', 'bin', 'milyon', 'milyar', 'trilyon'];
  const uc = n => {const y = Math.floor(n / 100), o = Math.floor(n % 100 / 10), b = n % 10; return [y ? (y > 1 ? B[y] + ' ' : '') + 'yüz' : '', O[o], B[b]].filter(Boolean).join(' ')};
  const yaz = n => {if (!n) return 'sıfır'; const p = []; let i = 0; while (n > 0) {const g = n % 1000; if (g) p.unshift(i == 1 && g == 1 ? 'bin' : uc(g) + (G[i] ? ' ' + G[i] : '')); n = Math.floor(n / 1000); i++} return p.join(' ')};
  const t = Math.round(Math.abs(N(tutar)) * 100), tl = Math.floor(t / 100), kr = t % 100;
  return 'Yalnız ' + yaz(tl) + ' Türk lirası' + (kr ? ' ' + yaz(kr) + ' kuruş' : '') + 'dır.';
};

const RAPOR = {
  stil: `#rapor{position:fixed;inset:0;z-index:70;background:#4a5660;overflow:auto}
  #rapor .rb{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 16px;background:#0d1d2b;color:#e3edf3}#rapor .rb b{flex:1;font:600 15px var(--fh)}
  #rapor .sayfa{background:#fff;color:#18222b;width:210mm;min-height:297mm;margin:18px auto;padding:13mm 13mm 20mm;box-shadow:0 10px 40px rgba(0,0,0,.35);font:9.6pt/1.42 'Segoe UI',Arial,sans-serif;position:relative;box-sizing:border-box}
  #rapor.yatay .sayfa{width:297mm;min-height:210mm}
  #rapor .bh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2.5px solid #0d1d2b;padding-bottom:10px;margin-bottom:12px}
  #rapor .bh .fi{font-size:8.6pt;color:#4b5b67;line-height:1.45}#rapor .bh .fi b{display:block;font-size:12.5pt;color:#0d1d2b;margin-bottom:2px}#rapor .bh img{max-height:52px;max-width:200px;display:block;margin-bottom:6px}
  #rapor .bh .bt{text-align:right}#rapor .bh .bt h1{font:700 17pt 'Bahnschrift','Segoe UI',sans-serif;margin:0;color:#0d1d2b;letter-spacing:.04em}#rapor .bh .bt div{font-size:9pt;color:#4b5b67}
  #rapor .kutular{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}#rapor .kt{border:1px solid #c9d4dd;border-radius:4px;padding:7px 10px;font-size:9pt}#rapor .kt small{display:block;font-size:7.6pt;letter-spacing:.12em;color:#119ea4;font-weight:700;margin-bottom:2px}
  #rapor table.r{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:10px}#rapor table.r th{background:#0d1d2b;color:#fff;font-weight:600;text-align:left;padding:5px 7px;font-size:8.4pt}#rapor table.r td{padding:4.5px 7px;border-bottom:1px solid #dfe6ec}#rapor table.r tr:nth-child(even) td{background:#f5f8fa}
  #rapor table.r .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}#rapor table.r tfoot td{font-weight:700;background:#e9eff3!important;border-top:1.5px solid #0d1d2b}
  #rapor .top{margin-left:auto;width:72mm;font-size:9.6pt}#rapor .top div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #e3e9ee}#rapor .top .gt{font-size:12pt;font-weight:700;border-top:2px solid #0d1d2b;border-bottom:0;padding-top:6px;color:#0d1d2b}
  #rapor .yz{font-style:italic;font-size:8.8pt;margin:8px 0;color:#33424d}#rapor h2{font:700 11pt 'Bahnschrift','Segoe UI',sans-serif;color:#0d1d2b;margin:14px 0 6px;letter-spacing:.03em}
  #rapor .imza{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px;font-size:9pt;text-align:center}#rapor .imza div{border-top:1px solid #8a99a5;padding-top:6px;min-height:60px}
  #rapor .ft{position:absolute;left:13mm;right:13mm;bottom:8mm;display:flex;align-items:center;gap:8px;font-size:7.4pt;color:#7a8a96;border-top:1px solid #dfe6ec;padding-top:5px}#rapor .ft svg{height:11px}#rapor .ft span{flex:1}
  #rapor .qr{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm}#rapor .qr>div{border:1.5px dashed #9fb0bc;border-radius:6px;padding:5mm;text-align:center;break-inside:avoid}#rapor .qr svg,#rapor .qr img{width:42mm;height:42mm}#rapor .qr b{display:block;font:700 18pt 'Bahnschrift',sans-serif;color:#0d1d2b}
  @media print{body>*:not(#rapor){display:none!important}#rapor{position:static;background:none;overflow:visible}#rapor .rb{display:none}#rapor .sayfa{margin:0;box-shadow:none;width:auto!important;min-height:0!important;padding:0 0 12mm;page-break-after:always}#rapor .sayfa:last-child{page-break-after:auto}#rapor .ft{position:fixed;left:0;right:0;bottom:0}}`,
  goster(baslik, sayfalar, yatay = false) {
    if (!$('#rpStil')) {const s = document.createElement('style'); s.id = 'rpStil'; s.textContent = RAPOR.stil; document.head.appendChild(s)}
    let ps = $('#rpSayfa'); if (!ps) {ps = document.createElement('style'); ps.id = 'rpSayfa'; document.head.appendChild(ps)} ps.textContent = `@page{size:A4 ${yatay ? 'landscape' : 'portrait'};margin:11mm}`;
    let r = $('#rapor'); if (!r) {r = document.createElement('div'); r.id = 'rapor'; document.body.appendChild(r)}
    r.className = yatay ? 'yatay' : ''; const eski = document.title; document.title = baslik;
    r.innerHTML = `<div class="rb"><b>${esc(baslik)}</b><button class="btn p" id="rpy">Yazdır / PDF kaydet</button><button class="btn" id="rpk">Kapat</button></div>${sayfalar.map(s => `<div class="sayfa">${s}${RAPOR.alt()}</div>`).join('')}`;
    $('#rpy').onclick = () => print(); $('#rpk').onclick = () => {r.remove(); document.title = eski};
    r.scrollTop = 0;
  },
  ust(baslik, satirlar) {
    const a = VERI.ayarlarSatiri();
    return `<div class="bh"><div class="fi">${a.logo ? `<img src="${a.logo}" alt="">` : ''}<b>${esc(a.firma_adi || 'Firma adı (Ayarlar → Firma bilgileri)')}</b>${esc(a.adres || '')}${a.adres ? '<br>' : ''}${[a.telefon, a.eposta].filter(Boolean).map(esc).join(' · ')}${a.vergi_no ? `<br>V.D.: ${esc(a.vergi_dairesi || '')} · V.N.: ${esc(a.vergi_no)}` : ''}</div><div class="bt"><h1>${esc(baslik)}</h1>${satirlar.map(s => `<div>${s}</div>`).join('')}</div></div>`;
  },
  alt() {return `<div class="ft">${LOGO(false, 11)}<span>NexDrive Saha ile hazırlanmıştır · NexDrive Engineering</span>${new Date().toLocaleString('tr-TR', {dateStyle: 'short', timeStyle: 'short'})}</div>`},
  kutu(baslik, ic) {return `<div class="kt"><small>${esc(baslik)}</small>${ic}</div>`},
  musteriKutu(m) {return m ? `<b>${esc(m.ad)}</b>${m.adres ? '<br>' + esc(m.adres) : ''}${m.vergi_no ? `<br>V.D.: ${esc(m.vergi_dairesi || '')} · V.N.: ${esc(m.vergi_no)}` : ''}${m.yetkili ? '<br>Yetkili: ' + esc(m.yetkili) : ''}` : '—'},

  hakedis(h) {
    const st = VERI.al('santiyeler', h.santiye_id), m = VERI.al('musteriler', h.musteri_id), a = VERI.ayarlarSatiri();
    const s1 = `${RAPOR.ust('HAKEDİŞ RAPORU', [`No: <b>${esc(h.no)}</b>`, `Düzenleme: ${tarihTR(h.fatura_tarihi || bugun())}`, `Dönem: ${tarihTR(h.donem_bas)} – ${tarihTR(h.donem_bit)}`])}
      <div class="kutular">${RAPOR.kutu('İŞVEREN', RAPOR.musteriKutu(m))}${RAPOR.kutu('ŞANTİYE / İŞ', `<b>${esc(st ? st.ad : '—')}</b>${st && st.adres ? '<br>' + esc(st.adres) : ''}${st && N(st.saat_ucreti) ? `<br>Saat ücreti: ${para(st.saat_ucreti)} (KDV hariç)` : ''}${h.fatura_no ? `<br>Fatura no: <b>${esc(h.fatura_no)}</b>` : ''}`)}</div>
      <table class="r"><thead><tr><th style="width:28px">#</th><th>Açıklama</th><th class="n">Miktar</th><th>Birim</th><th class="n">Birim fiyat</th><th class="n">Tutar</th></tr></thead><tbody>${(h.kalemler || []).map((k, i) => `<tr><td>${i + 1}</td><td>${esc(k.aciklama)}</td><td class="n">${sayi(k.miktar, 2)}</td><td>${esc(k.birim)}</td><td class="n">${para(k.birim_fiyat)}</td><td class="n">${para(k.tutar)}</td></tr>`).join('')}</tbody></table>
      <div class="top"><div><span>Ara toplam</span><b>${para(h.ara_toplam)}</b></div><div><span>KDV (%${sayi(h.kdv_orani)})</span><span>${para(N(h.kdv) + N(h._tevkif))}</span></div>${h._tevkif ? `<div><span>KDV tevkifatı (${esc(h.tevkifat)})</span><span>−${para(h._tevkif)}</span></div>` : ''}<div class="gt"><span>Genel toplam</span><span>${para(h.toplam)}</span></div></div>
      <div class="yz">${esc(yaziyla(h.toplam))}</div>
      ${h.vade || a.iban ? `<div class="kt" style="margin-top:8px">${h.vade ? `Son ödeme tarihi: <b>${tarihTR(h.vade)}</b>` : ''}${h.vade && a.iban ? ' · ' : ''}${a.iban ? `IBAN: <b>${esc(a.iban)}</b> (${esc(a.firma_adi || '')})` : ''}</div>` : ''}
      ${h.notlar ? `<p style="margin-top:10px;font-size:9pt"><b>Not:</b> ${esc(h.notlar)}</p>` : ''}
      <div class="imza"><div>Hazırlayan (Yüklenici)<br><b>${esc(a.firma_adi || '')}</b></div><div>Kontrol / Onay (İşveren)<br><b>${esc(m ? m.ad : '')}</b></div></div>`;
    const S = HESAP.donem(VERI.liste('seferler'), h.donem_bas, h.donem_bit).filter(s => s.santiye_id == h.santiye_id), gun = {};
    S.forEach(s => {const g = gun[s.tarih] = gun[s.tarih] || {n: 0, ar: {}}; g.n++; const k = VERI.ad('araclar', s.arac_id, 'kod') || '?'; g.ar[k] = (g.ar[k] || 0) + 1});
    const P = HESAP.donem(VERI.liste('puantaj'), h.donem_bas, h.donem_bit).filter(p => p.santiye_id == h.santiye_id && p.arac_id).sort((x, y) => x.tarih.localeCompare(y.tarih));
    const G = Object.entries(gun).sort(), sayfalar = [s1];
    if (G.length || P.length) {
      const ek = `${RAPOR.ust('EK-1 · İŞ DÖKÜMÜ', [`Hakediş: <b>${esc(h.no)}</b>`, esc(st ? st.ad : '')])}
        ${P.length ? `<h2>Araç / makine çalışma saatleri</h2><table class="r"><thead><tr><th>Tarih</th><th>Araç</th><th>Personel</th><th class="n">Sayaç</th><th class="n">Saat</th><th class="n">Saat ücreti</th><th class="n">Tutar</th></tr></thead><tbody>${P.map(p => `<tr><td>${tarihTR(p.tarih)}</td><td>${esc(VERI.ad('araclar', p.arac_id, 'kod'))}</td><td>${esc(VERI.ad('personel', p.personel_id))}</td><td class="n">${p.sayac_bit ? sayi(p.sayac_bas, 1) + ' → ' + sayi(p.sayac_bit, 1) : ''}</td><td class="n">${sayi(HESAP.calismaSaat(p), 1)}</td><td class="n">${para(HESAP.saatUcreti(p))}</td><td class="n">${para(HESAP.calismaGelir(p))}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Toplam</td><td class="n">${sayi(P.reduce((t, p) => t + HESAP.calismaSaat(p), 0), 1)}</td><td></td><td class="n">${para(P.reduce((t, p) => t + HESAP.calismaGelir(p), 0))}</td></tr></tfoot></table>` : ''}
        ${G.length ? `<h2>Günlük sefer dökümü</h2><table class="r"><thead><tr><th>Tarih</th><th class="n">Sefer</th><th>Araç bazında sefer</th></tr></thead><tbody>${G.map(([t, g]) => `<tr><td>${tarihTR(t)}</td><td class="n">${g.n}</td><td style="font-size:8.2pt">${Object.entries(g.ar).sort().map(([k, n]) => `${esc(k)}: ${n}`).join(' · ')}</td></tr>`).join('')}</tbody><tfoot><tr><td>Toplam (${G.length} gün)</td><td class="n">${S.length}</td><td></td></tr></tfoot></table>` : ''}
        <p style="font-size:8.4pt;color:#5b6f7c">Sefer kayıtları döküm fişi numaralarıyla birlikte sistemde saklanmaktadır; talep halinde fiş bazında liste sunulur.</p>`;
      sayfalar.push(ek);
    }
    RAPOR.goster('Hakediş ' + h.no, sayfalar);
  },

  ekstre(mid) {
    const m = VERI.al('musteriler', mid), C = CARI(m), A = HESAP.alacak(mid), k = A.kova;
    RAPOR.goster('Cari ekstre · ' + m.ad, [`${RAPOR.ust('CARİ HESAP EKSTRESİ', [`Tarih: ${tarihTR(bugun())}`, `Vade: ${m.vade_gun ? m.vade_gun + ' gün' : '—'}`])}
      <div class="kutular">${RAPOR.kutu('MÜŞTERİ', RAPOR.musteriKutu(m))}${RAPOR.kutu('ÖZET', `Toplam hakediş: <b>${para(A.borc)}</b><br>Toplam tahsilat: <b>${para(A.tahsil)}</b><br>Bakiye: <b style="font-size:11pt">${para(A.bakiye)}</b>${A.fazla ? '<br>Fazla ödeme: ' + para(A.fazla) : ''}`)}</div>
      <table class="r"><thead><tr><th>Tarih</th><th>Belge</th><th>Açıklama</th><th class="n">Borç</th><th class="n">Alacak</th><th class="n">Bakiye</th></tr></thead><tbody>${C.map(x => `<tr><td>${tarihTR(x.tarih)}</td><td>${esc(x.belge)}</td><td style="font-size:8.4pt">${esc(x.ac)}</td><td class="n">${x.borc ? para(x.borc) : ''}</td><td class="n">${x.alacak ? para(x.alacak) : ''}</td><td class="n"><b>${para(x.bakiye)}</b></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Toplam</td><td class="n">${para(A.borc)}</td><td class="n">${para(A.tahsil)}</td><td class="n">${para(A.bakiye)}</td></tr></tfoot></table>
      ${A.bakiye > .005 ? `<h2>Açık hakedişler ve vade durumu</h2><table class="r"><thead><tr><th>Hakediş</th><th>Vade</th><th class="n">Tutar</th><th class="n">Ödenen</th><th class="n">Kalan</th><th class="n">Gecikme</th></tr></thead><tbody>${A.satir.filter(s => s.kalan > .005).map(s => `<tr><td>${esc(s.h.no)}</td><td>${tarihTR(s.h.vade)}</td><td class="n">${para(s.h.toplam)}</td><td class="n">${para(s.odenen)}</td><td class="n"><b>${para(s.kalan)}</b></td><td class="n">${s.gecikme > 0 ? s.gecikme + ' gün' : '—'}</td></tr>`).join('')}</tbody></table>
      <div class="kt" style="font-size:8.8pt">Vadesi gelmemiş: <b>${para(k.gelmemis)}</b> · 1–30 gün: <b>${para(k.g30)}</b> · 31–60 gün: <b>${para(k.g60)}</b> · 61–90 gün: <b>${para(k.g90)}</b> · 90+ gün: <b>${para(k.g90p)}</b></div>` : ''}
      <p style="font-size:8.6pt;margin-top:14px">Yukarıdaki bakiyeye mutabık olmadığınız takdirde 15 gün içinde bildirmenizi rica ederiz.${VERI.ayarlarSatiri().iban ? ' Ödemeler için IBAN: <b>' + esc(VERI.ayarlarSatiri().iban) + '</b>' : ''}</p>
      <div class="imza"><div>${esc(VERI.ayarlarSatiri().firma_adi || '')}</div><div>Mutabakat · ${esc(m.ad)}</div></div>`]);
  },

  gunluk(t) {
    if (!t) {const al = [{k: 'tarih', ad: 'Rapor tarihi', t: 'date', vars: bugun, tam: 1}]; return UI.ac({baslik: 'Günlük sefer raporu', govde: UI.formHTML(al, {}), butonlar: [{ad: 'Vazgeç', fn: () => {}}, {ad: 'Raporu aç', sinif: 'p', fn: () => {const v = UI.formOku(al); setTimeout(() => RAPOR.gunluk(v.tarih || bugun()), 0)}}]})}
    const S = VERI.liste('seferler').filter(s => s.tarih == t), Y = VERI.liste('yakit').filter(y => y.tarih == t), P = VERI.liste('puantaj').filter(p => p.tarih == t), B = VERI.liste('bakim').filter(b => b.tarih == t);
    const ar = {}; S.forEach(s => {const x = ar[s.arac_id] = ar[s.arac_id] || {n: 0, sof: new Set(), rota: {}, saat: []}; x.n++; if (s.personel_id) x.sof.add(VERI.ad('personel', s.personel_id)); const r = [VERI.ad('yukleme_sahalari', s.yukleme_id), VERI.ad('dokum_sahalari', s.dokum_id)].filter(Boolean).join(' → ') || VERI.ad('santiyeler', s.santiye_id) || '—'; x.rota[r] = (x.rota[r] || 0) + 1; if (s.saat) x.saat.push(s.saat)});
    const M = P.filter(p => p.arac_id), sti = {}, stx = id => sti[id] = sti[id] || {n: 0, saat: 0, t: 0, d: 0};
    S.forEach(s => {const x = stx(s.santiye_id || ''); x.n++; x.t += HESAP.seferGelir(s); x.d += HESAP.seferGider(s)}); M.forEach(p => {const x = stx(p.santiye_id || ''); x.saat += HESAP.calismaSaat(p); x.t += HESAP.calismaGelir(p)});
    RAPOR.goster('Günlük rapor ' + tarihTR(t), [`${RAPOR.ust('GÜNLÜK SAHA RAPORU', [`<b>${tarihTR(t)}</b> · ${new Date(t + 'T12:00:00').toLocaleDateString('tr-TR', {weekday: 'long'})}`, `${sayi(M.reduce((a, p) => a + HESAP.calismaSaat(p), 0), 1)} saat · ${S.length} sefer`])}
      <h2>Çalışma saatleri ve kazanç</h2>${M.length ? `<table class="r"><thead><tr><th>Araç</th><th>Personel</th><th>İş / şantiye</th><th class="n">Sayaç</th><th class="n">Saat</th><th class="n">Saat ücreti</th><th class="n">Tutar</th></tr></thead><tbody>${M.map(p => `<tr><td><b>${esc(VERI.ad('araclar', p.arac_id, 'kod'))}</b></td><td>${esc(VERI.ad('personel', p.personel_id))}</td><td>${esc(VERI.ad('santiyeler', p.santiye_id))}</td><td class="n">${p.sayac_bit ? sayi(p.sayac_bas, 1) + ' → ' + sayi(p.sayac_bit, 1) : ''}</td><td class="n">${sayi(HESAP.calismaSaat(p), 1)}</td><td class="n">${para(HESAP.saatUcreti(p))}</td><td class="n">${para(HESAP.calismaGelir(p))}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Toplam</td><td class="n">${sayi(M.reduce((a, p) => a + HESAP.calismaSaat(p), 0), 1)}</td><td></td><td class="n">${para(M.reduce((a, p) => a + HESAP.calismaGelir(p), 0))}</td></tr></tfoot></table>` : '<p>Çalışma kaydı yok.</p>'}
      <h2>Seferler</h2>${Object.keys(ar).length ? `<table class="r"><thead><tr><th>Araç</th><th>Şoför</th><th>Güzergâh (yükleme → döküm)</th><th>İlk – son</th><th class="n">Sefer</th></tr></thead><tbody>${Object.entries(ar).sort((x, y) => VERI.ad('araclar', x[0], 'kod').localeCompare(VERI.ad('araclar', y[0], 'kod'))).map(([id, x]) => {x.saat.sort(); return `<tr><td><b>${esc(VERI.ad('araclar', id, 'kod'))}</b> ${esc(VERI.ad('araclar', id, 'plaka'))}</td><td>${esc([...x.sof].join(', '))}</td><td style="font-size:8.2pt">${Object.entries(x.rota).map(([k, n]) => `${esc(k)}: ${n}`).join('<br>')}</td><td>${x.saat.length ? x.saat[0] + ' – ' + x.saat[x.saat.length - 1] : ''}</td><td class="n">${x.n}</td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="4">Toplam · ${Object.keys(ar).length} araç</td><td class="n">${S.length}</td></tr></tfoot></table>` : '<p>Sefer kaydı yok.</p>'}
      ${Object.keys(sti).length ? `<h2>İş özeti</h2><table class="r"><thead><tr><th>İş / şantiye</th><th class="n">Saat</th><th class="n">Sefer</th><th class="n">Kazanç</th><th class="n">Döküm gideri</th></tr></thead><tbody>${Object.entries(sti).map(([id, x]) => `<tr><td>${esc(VERI.ad('santiyeler', id) || 'İş seçilmemiş')}</td><td class="n">${sayi(x.saat, 1)}</td><td class="n">${x.n}</td><td class="n">${para(x.t)}</td><td class="n">${para(x.d)}</td></tr>`).join('')}</tbody></table>` : ''}
      ${Y.length ? `<h2>Yakıt</h2><table class="r"><thead><tr><th>Araç</th><th>Personel</th><th>İstasyon</th><th class="n">Litre</th><th class="n">Tutar</th></tr></thead><tbody>${Y.map(y => `<tr><td>${esc(VERI.ad('araclar', y.arac_id, 'kod'))}</td><td>${esc(VERI.ad('personel', y.personel_id))}</td><td>${esc(y.istasyon || '')}</td><td class="n">${sayi(y.litre)}</td><td class="n">${para(y.tutar)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Toplam</td><td class="n">${sayi(Y.reduce((a, y) => a + N(y.litre), 0))}</td><td class="n">${para(Y.reduce((a, y) => a + N(y.tutar), 0))}</td></tr></tfoot></table>` : ''}
      ${B.length ? `<h2>Arıza / bakım bildirimleri</h2><table class="r"><tbody>${B.map(b => `<tr><td>${esc(VERI.ad('araclar', b.arac_id, 'kod'))}</td><td>${esc(BAKIM_TIP[b.tip] || b.tip)}</td><td>${esc(b.aciklama)}</td><td>${b.durum == 'acik' ? 'Açık' : 'Kapandı'}</td></tr>`).join('')}</tbody></table>` : ''}
      <p style="font-size:8.6pt">Puantaj: ${new Set(P.map(p => p.personel_id)).size} personel · ${sayi(P.reduce((a, p) => a + N(p.saat), 0), 1)} saat normal + ${sayi(P.reduce((a, p) => a + N(p.mesai), 0), 1)} saat mesai</p>`]);
  },

  puantaj(ay) {

      s += `<g transform="translate(${x},${yy})">${d ? '<path d="M-32 18 L0 -22 L32 18Z" fill="#8a6a45" stroke="#5e472c"/>' : `<rect x="-30" y="-20" width="60" height="40" rx="5" fill="none" stroke="var(--ac)" stroke-width="3.5" ${y.t == 'santiyeler' ? 'stroke-dasharray="6 4"' : ''}/>`}<text y="-30" text-anchor="middle" font-size="20" font-weight="600" fill="var(--tx)" style="paint-order:stroke;stroke:var(--p2);stroke-width:5px">${esc(String(y.ad).slice(0, 28))}</text></g>`});

/* ---------------- AI asistan · kural motoru v2 (çevrimdışı) ---------------- */
const ASISTAN = {log: [], ctx: null, son: null, kayit: null};
const AS = ASISTAN;
const _P = x => para(x, false), _S = (x, d = 0) => sayi(x, d);
AS.TR = {'ı': 'i', 'ş': 's', 'ğ': 'g', 'ü': 'u', 'ö': 'o', 'ç': 'c', 'â': 'a', 'î': 'i', 'û': 'u'};
AS.nrm = s => String(s || '').toLocaleLowerCase('tr').replace(/[ışğüöçâîû]/g, c => AS.TR[c]).replace(/[’'`]/g, '').replace(/[^a-z0-9.,:\/\s-]/g, ' ').replace(/\s+/g, ' ').trim();
AS.duz = s => AS.nrm(s).replace(/[\s.\-\/]/g, '');
AS.lev = (a, b) => {const m = []; for (let i = 0; i <= a.length; i++) {m[i] = [i]; for (let j = 1; j <= b.length; j++) m[i][j] = i ? Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] == b[j - 1] ? 0 : 1)) : j} return m[a.length][b.length]};
AS.EK = /^(nin|in|un|nun|a|e|ya|ye|i|yi|u|yu|da|de|ta|te|dan|den|tan|ten|la|le|yla|yle|ler|lar|leri|lari|ninki|inki|ca|ce|cu|ci|cigim|im|um|ım)?$/;
/* isim eşleşmesi: tam, Türkçe ek almış ya da (uzun isimde) bir harf hatalı */
AS.tok = (T, w) => w && T.some(t => t == w || (t.startsWith(w) && (w.length >= 5 || AS.EK.test(t.slice(w.length)))) || (w.length >= 6 && t.length >= w.length - 1 && AS.lev(t.slice(0, w.length), w) <= 1));
/* anahtar kelime kökü: kökle başlayan her kelime; 6+ harfte bir harf hata payı */
AS.kok = (T, k) => T.some(t => t.startsWith(k) || (k.length >= 6 && t.length >= k.length - 1 && AS.lev(t.slice(0, k.length), k) <= 1));
AS.ifade = (n, k) => (' ' + n + ' ').includes(' ' + k);
AS.puan = (c, L) => L.reduce((p, k) => p + (k.includes(' ') ? (AS.ifade(c.n, k) ? 2 : 0) : AS.kok(c.T, k) ? 1 : 0), 0);
AS.var = (c, ...L) => L.some(k => k.includes(' ') ? AS.ifade(c.n, k) : AS.kok(c.T, k));
AS.esc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  const b = bugun(), y = +b.slice(0, 4), buAy = +b.slice(5, 7) - 1, out = [], dolu = [], AY = AS.AYLAR.join('|');
  const ekle = (x, bas, bit, ad) => {const s = x.index, e = s + x[0].length; if (dolu.some(([a, z]) => s < z && e > a)) return; dolu.push([s, e]); if (bas > bit) [bas, bit] = [bit, bas]; out.push({i: s, bas, bit, ad})};
  const yil = (mo, ac) => ac ? +ac < 100 ? 2000 + +ac : +ac : mo > buAy ? y - 1 : y;
  const t = (yy, mo, d) => `${yy}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

  R(new RegExp(`\\b(\\d{1,2})\\s*(?:-|ile|ve|den|dan|ten|tan)\\s*(\\d{1,2})\\s+(${AY})(?:\\s+(\\d{4}))?`, 'g'), x => {const mo = AS.AYLAR.indexOf(x[3]), yy = yil(mo, x[4]); ekle(x, t(yy, mo, x[1]), t(yy, mo, x[2]), `${x[1]}–${x[2]} ${AS.AYAD[mo]}`)});
  R(/\bson (\d+) (gun|hafta|ay)/g, x => {const k = +x[1], u = x[2]; ekle(x, u == 'gun' ? gunEkle(b, -(k - 1)) : u == 'hafta' ? gunEkle(b, -(7 * k - 1)) : ayEkle(b, -k), b, `Son ${k} ${u == 'gun' ? 'gün' : u}`)});
  R(new RegExp(`\\b(\\d{1,2})\\s+(${AY})[a-z]*(?:\\s+(\\d{4}))?`, 'g'), x => {const mo = AS.AYLAR.indexOf(x[2]), d = t(yil(mo, x[3]), mo, x[1]); ekle(x, d, d, tarihTR(d))});
  R(/\b(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?\b(?!\s*(saat|litre|lt|l|km|bin|tl|lira|m3|kup|milyon|ton))/g, x => {const d = +x[1], mo = +x[2] - 1; if (d < 1 || d > 31 || mo < 0 || mo > 11) return; const g = t(yil(mo, x[3]), mo, d); ekle(x, g, g, tarihTR(g))});
  R(new RegExp(`\\b(${AY})(da|de|ta|te|in|un|i|ayi|ayinda|ayindaki|daki|deki)?\\b(?:\\s+(\\d{4}))?`, 'g'), x => {const mo = AS.AYLAR.indexOf(x[1]), yy = yil(mo, x[3]), bas = t(yy, mo, 1); ekle(x, bas, gunEkle(ayEkle(bas, 1), -1), `${AS.AYAD[mo]} ${yy}`)});

  R(/\b(bu|gecen|onceki) ay(ki|da|in|lik)?\b/g, x => {const [bas, bit] = DONEM.hesap(x[1] == 'bu' ? 'ay' : 'gecenay'); ekle(x, bas, bit, x[1] == 'bu' ? 'Bu ay' : 'Geçen ay')});
  R(/\b(bu|gecen) yil(ki|da|in)?\b/g, x => {const yy = x[1] == 'bu' ? y : y - 1; ekle(x, yy + '-01-01', x[1] == 'bu' ? b : yy + '-12-31', x[1] == 'bu' ? 'Bu yıl' : 'Geçen yıl')});
  R(new RegExp(`\\b(gecen )?(${AS.GUNLER.join('|')})(gunu|ya|ye|yi|da|de|ki)?\\b`, 'g'), x => {const h = AS.GUNI[x[2]], bi = (new Date(b + 'T12:00:00').getDay() + 6) % 7; let f = (bi - h + 7) % 7; if (x[1]) f += 7; const d = gunEkle(b, -f); ekle(x, d, d, `${x[1] ? 'Geçen ' : ''}${AS.GUNAD[x[2]]} (${tarihTR(d)})`)});
  R(/\b(evvelsi|onceki) gun\b/g, x => {const d = gunEkle(b, -2); ekle(x, d, d, tarihTR(d))});

AS.DONEM = {bugun: () => ({bas: bugun(), bit: bugun(), ad: 'Bugün'}), ay: () => ({bas: ayBasi(), bit: bugun(), ad: 'Bu ay'}), hafta: () => {const [bas, bit] = DONEM.hesap('hafta'); return {bas, bit, ad: 'Bu hafta'}}, yil: () => ({bas: bugun().slice(0, 4) + '-01-01', bit: bugun(), ad: 'Bu yıl'})};
AS.per = (c, v = 'ay') => c.d || AS.DONEM[v]();
AS.kucuk = d => d.ad.replace(/^(Bu|Son|Dün|Bugün|Geçen)/, m => m.toLocaleLowerCase('tr'));

/* ---------- varlıklar: araç, personel, müşteri, iş, döküm sahası ---------- */
AS.varliklar = (n, T) => {
  const Td = T.map(t => t.replace(/[.\-\/]/g, '')), f = n.replace(/[\s.\-\/]/g, ''), ilk = s => AS.nrm(s).split(' ').filter(Boolean);
  const isim = ad => {const w = ilk(ad); if (!w.length) return false; if (w.length > 1 && AS.ifade(n, w.slice(0, 2).join(' '))) return true; return w[0].length >= 3 && AS.tok(T, w[0])};
  const AR = VERI.liste('araclar').filter(a => a.durum != 'satildi');
  const araclar = AR.filter(a => {const k = AS.duz(a.kod), k2 = k.replace(/([a-z])0+(\d)/, '$1$2'), p = AS.duz(a.plaka); return (k && (Td.includes(k) || Td.includes(k2) || (k.length >= 3 && new RegExp('(^|[^a-z0-9])' + AS.esc(AS.nrm(a.kod)).replace(/[\s-]+/g, '[\\s-]*') + '(?![0-9])').test(n)))) || (p.length >= 5 && f.includes(p))});
  const nm = n.match(/\b(\d{1,2})(?:\.|\s*(?:numarali|nolu|no lu|no))?\s*(kamyon|arac|makine|ekskavator|kepce)/);
  if (nm && !araclar.length) {const no = +nm[1], mk = nm[2] != 'kamyon' && nm[2] != 'arac', a = AR.find(x => +(String(x.kod || '').match(/\d+/) || [])[0] == no && (nm[2] == 'arac' || ISMAKINESI(x.tip) == mk)); if (a) araclar.push(a)}
  const personeller = VERI.liste('personel').filter(p => isim(p.ad));
  const musteriler = VERI.liste('musteriler').filter(m => isim(m.ad));
  const santiyeler = VERI.liste('santiyeler').filter(s => isim(s.ad));
  const dokumlar = VERI.liste('dokum_sahalari').filter(d => isim(d.ad));
  const personel = personeller[0] || null;
  return {araclar, personeller, musteriler, santiyeler, dokumlar, personel, arac: araclar[0] || (personel && VERI.al('araclar', personel.varsayilan_arac)) || null, musteri: musteriler[0] || null, santiye: santiyeler[0] || null, dokum: dokumlar[0] || null};
};
AS.temizSayi = c => {
  let s = c.n.replace(/\b\d{1,2}[.\/]\d{1,2}([.\/]\d{2,4})?\b(?!\s*(saat|litre|lt|l|km|bin|tl|lira|m3|kup|milyon))/g, ' ').replace(/\bson \d+ (gun|hafta|ay)/g, ' ').replace(new RegExp(`\\b\\d{1,2}(\\s*(-|ile|ve)\\s*\\d{1,2})?\\s+(${AS.AYLAR.join('|')})[a-z]*(\\s+\\d{4})?`, 'g'), ' ').replace(/\b(19|20)\d{2}\b/g, ' ');
  c.e.araclar.forEach(a => [a.kod, a.plaka].filter(Boolean).forEach(v => {s = s.replace(new RegExp(AS.esc(AS.nrm(v)).replace(/[\s-]+/g, '[\\s-]*'), 'g'), ' ')}));
  return s.replace(/\b[a-z]{1,2}-?\d{1,3}\b/g, ' ');
};
AS.tutarlar = s => {const o = [], re = /(\d{1,3}(?:\.\d{3})+|\d+(?:,\d+)?)\s*(milyon|bin|k\b)?/g, t = s.replace(/m3|metrekup|kup/g, ' '); let m; while ((m = re.exec(t))) {let v = +m[1].replace(/\.(?=\d{3})/g, '').replace(',', '.'); if (m[2] == 'bin' || m[2] == 'k') v *= 1e3; if (m[2] == 'milyon') v *= 1e6; o.push(v)} return o};
AS.sayiAl = (s, re) => {const m = s.match(re); return m ? +String(m[1] || m[2] || m[3]).replace(/\.(?=\d{3})/g, '').replace(',', '.') : null};
AS.tl = s => {const m = s.match(/(\d{1,3}(?:\.\d{3})+|\d+(?:,\d+)?)\s*(milyon|bin)?\s*(tl|lira)\b/); if (!m) return null; let v = +m[1].replace(/\.(?=\d{3})/g, '').replace(',', '.'); if (m[2] == 'bin') v *= 1e3; if (m[2] == 'milyon') v *= 1e6; return v};
AS.baglam = q => {const n = AS.nrm(q), T = n.split(' ').filter(Boolean), c = {q, n, T}; c.e = AS.varliklar(n, T); c.ds = AS.tarihler(n); c.d = c.ds[0] || null; c.sn = AS.temizSayi(c); c.tut = AS.tutarlar(c.sn); return c};
AS.varlikVar = e => e.araclar.length || e.personeller.length || e.musteriler.length || e.santiyeler.length || e.dokumlar.length;
AS.tablo = (h, R) => `<div class="tw" style="margin-top:6px"><table class="t"><thead><tr>${h.map((x, i) => `<th class="${i ? 'n' : ''}">${x}</th>`).join('')}</tr></thead><tbody>${R.map(r => `<tr>${r.map((v, i) => `<td class="${i ? 'n' : ''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
AS.rota = s => [VERI.ad('yukleme_sahalari', s.yukleme_id), VERI.ad('dokum_sahalari', s.dokum_id)].filter(Boolean).join(' → ') || VERI.ad('santiyeler', s.santiye_id);

/* ---------- ölçüler (dönem bazında) ---------- */
AS.mPers = (p, d) => {
  const P = HESAP.donem(VERI.liste('puantaj'), d.bas, d.bit).filter(x => x.personel_id == p.id), S = HESAP.donem(VERI.liste('seferler'), d.bas, d.bit).filter(x => x.personel_id == p.id), Y = HESAP.donem(VERI.liste('yakit'), d.bas, d.bit).filter(x => x.personel_id == p.id);

};
AS.mArac = (a, d) => KAR.arac(d.bas, d.bit).find(r => r.a.id == a.id) || {a, saat: 0, sefer: 0, gelir: 0, yakit: 0, litre: 0, bakim: 0, dokum: 0, iscilik: 0, net: 0};
AS.mSant = (s, d) => {const P = HESAP.donem(VERI.liste('puantaj'), d.bas, d.bit).filter(x => x.santiye_id == s.id && x.arac_id), S = HESAP.donem(VERI.liste('seferler'), d.bas, d.bit).filter(x => x.santiye_id == s.id); return {s, saat: P.reduce((t, x) => t + HESAP.calismaSaat(x), 0), sefer: S.length, kazanc: P.reduce((t, x) => t + HESAP.calismaGelir(x), 0) + S.reduce((t, x) => t + HESAP.seferGelir(x), 0), gider: S.reduce((t, x) => t + HESAP.seferGider(x), 0), bek: OFIS.bekleyenIs().find(x => x.st.id == s.id)}};

AS.mDok = (k, d) => {const S = HESAP.donem(VERI.liste('seferler'), d.bas, d.bit).filter(x => x.dokum_id == k.id); return {k, sefer: S.length, gider: S.reduce((t, x) => t + HESAP.seferGider(x), 0), arac: new Set(S.map(x => x.arac_id)).size}};
AS.MF = {sefer: ['Sefer', v => _S(v)], saat: ['Saat', v => _S(v, 1)], mesai: ['Mesai (saat)', v => _S(v, 1)], gun: ['Gün', v => _S(v)], litre: ['Yakıt (L)', v => _S(v)], kazanc: ['Kazanç', _P], net: ['Net', _P], bakiye: ['Bakiye', _P], gider: ['Gider', _P], bakim: ['Bakım', _P], tahakkuk: ['Tahakkuk', _P], tahsil: ['Tahsilat', _P], gecikmis: ['Gecikmiş', _P]};

AS.metrik = c => {for (const [k, L] of AS.METRIK) if (L.some(w => w.includes(' ') ? AS.ifade(c.n, w.trim()) : AS.kok(c.T, w))) return k; return null};
AS.konu = c => {const T = c.T; if (AS.var(c, 'dokum sahasi', 'dokum yeri', 'dokum sahalari', 'dokumler')) return 'dokum'; if (T.some(t => ['is', 'isi', 'isler', 'isleri', 'iste', 'islerden', 'islerin', 'isini', 'isine', 'isinde', 'isinin', 'isleri'].includes(t)) || AS.var(c, 'santiye', 'proje', 'kazi')) return 'santiye'; if (AS.var(c, 'firma', 'musteri', 'isveren', 'sirket')) return 'musteri'; if (AS.var(c, 'arac', 'kamyon', 'makine', 'ekskavator', 'kepce', 'loder', 'dozer', 'filo', 'plaka')) return 'arac'; if (AS.var(c, 'sofor', 'operator', 'personel', 'eleman', 'isci', 'calisan', 'usta')) return 'personel'; return null};
AS.satirlar = (konu, d, tip) => {
  if (konu == 'personel') return VERI.liste('personel').filter(p => p.aktif !== false).map(p => ({ad: p.ad, ...AS.mPers(p, d)}));
  if (konu == 'arac') return KAR.arac(d.bas, d.bit).filter(r => !tip || (tip == 'kamyon' ? !ISMAKINESI(r.a.tip) : ISMAKINESI(r.a.tip))).map(r => ({ad: r.a.kod, ...r, kazanc: r.gelir, gider: r.yakit + r.bakim + r.dokum + r.iscilik}));

AS.VARSAY = {personel: 'saat', arac: 'net', musteri: 'bakiye', santiye: 'kazanc', dokum: 'sefer'};
AS.UYGUN = {personel: ['sefer', 'saat', 'mesai', 'gun', 'litre', 'tahakkuk', 'kazanc'], arac: ['sefer', 'saat', 'litre', 'kazanc', 'net', 'bakim', 'gider'], musteri: ['bakiye', 'gecikmis', 'kazanc', 'sefer', 'saat', 'tahsil'], santiye: ['kazanc', 'saat', 'sefer', 'gider'], dokum: ['sefer', 'gider']};

/* ---------- işlem kaydı (geri al için) ---------- */

  VERI.kaydet = (t, r, s) => {const e = r.id && VERI.al(t, r.id) ? JSON.parse(JSON.stringify(VERI.al(t, r.id))) : null; const x = orj(t, r, s); L.push({t, id: x.id, eski: e}); return x};
  try {return fn()} finally {VERI.kaydet = orj; if (L.length) AS.son = L}
};
AS.geriAl = () => {
  const L = AS.son; if (!L || !L.length) return 'Geri alınacak bir işlem yok.';
  const gor = new Set(); [...L].reverse().forEach(o => {const k = o.t + o.id; if (gor.has(k)) return; gor.add(k); const ilk = L.find(x => x.t == o.t && x.id == o.id); if (ilk.eski) {const {_yerel, ...r} = ilk.eski; VERI.kaydet(o.t, r)} else VERI.sil(o.t, o.id)});
  AS.son = null; return `Son işlemi geri aldım (${gor.size} kayıt eski haline döndü).`;
};

/* ---------- hesap makinesi ---------- */
AS.hesap = q => {
  const r = String(q).trim().toLocaleLowerCase('tr'), kdv = N(VERI.ayarlarSatiri().kdv_orani, 20);
  const say = s => +String(s).replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.');
  let m = r.match(/^([\d.,\s]+)\s*(bin|milyon)?\s*(tl|lira|₺)?\s*(\+|artı)?\s*kdv\s*(dahil)?\s*(ne kadar|kaç|eder|\?)*$/);
  if (m) {let v = say(m[1]) * (m[2] == 'bin' ? 1e3 : m[2] == 'milyon' ? 1e6 : 1); if (m[5]) {const net = v / (1 + kdv / 100); return `${_P(v)} KDV dahil → net <b>${para(net)}</b>, KDV (%${kdv}) ${para(v - net)}.`} return `${_P(v)} + %${kdv} KDV (${para(v * kdv / 100)}) = <b>${para(v * (1 + kdv / 100))}</b>.`}
  m = r.match(/^([\d.,]+)\s*('?[a-zığüşöç]*)?\s*(?:%|yüzde)\s*([\d.,]+)\s*('?[a-zığüşöç]*)?\s*(ne kadar|kaç|eder|\?)*$/) || r.match(/^(?:%|yüzde)\s*([\d.,]+)\s+([\d.,]+)/);
  if (m) {const [a, p] = m.length > 4 ? [say(m[1]), say(m[3])] : [say(m[2]), say(m[1])]; if (isFinite(a) && isFinite(p)) return `${_S(a, 2)} × %${_S(p, 2)} = <b>${_S(a * p / 100, 2)}</b>`}
  const ex = r.replace(/\s*(=|\?|kaç eder|ne eder|kaç|eder)\s*$/, '').trim();
  if (/^[\d\s.,+\-*/x×÷()]+$/.test(ex) && /\d\s*[+\-*/x×÷]\s*[\d(]/.test(ex)) {
    const js = ex.replace(/[x×]/g, '*').replace(/÷/g, '/').replace(/(\d)\.(?=\d{3}(\D|$))/g, '$1').replace(/,/g, '.');
    try {const v = Function('"use strict";return (' + js + ')')(); if (isFinite(v)) return `${esc(ex)} = <b>${_S(v, 4)}</b>`} catch (e) {}
  }
  return null;
};

/* ---------- öneri listesi: bugün neyle ilgilenmeli ---------- */
AS.oneriler = () => {
  const L = [], b = bugun(), A = OFIS.alacakToplam();
  A.mus.filter(x => x.g > 0).sort((x, y) => y.g - x.g).slice(0, 3).forEach(x => L.push([9, `<b>${esc(x.m.ad)}</b>'dan ${_P(x.g)} gecikmiş alacak (en eski ${x.enEski} gün) — ara, tahsil et. ${AS.git('alacak/' + x.m.id, 'Ekstre')}`]));
  KOMUTA.aktifler().forEach(a => {const d = KOMUTA.durum(a); if (d.k == 'ariza' || d.ariza) L.push([8, `<b>${esc(a.kod)}</b> arızalı — tamir planla. ${AS.git('makineler', 'Bakım')}`])});
  const nk = KAR.akis(UI.hal.nkO || {}), min = nk.W.reduce((m, w) => w.kasa < m.kasa ? w : m, nk.W[0]); if (nk.kasa && min.kasa < 0) L.push([8, `Kasa ${tarihTR(min.bas)} haftasında <b style="color:var(--rd)">${_P(min.kasa)}</b>'ye düşüyor — ödemeleri kaydır ya da tahsilatı hızlandır. ${AS.git('nakit', 'Nakit')}`]);
  VERI.liste('araclar').filter(a => a.durum != 'satildi').forEach(a => {const x = HESAP.bakimDurum(a); if (x.durum == 'gecikti') L.push([7, `<b>${esc(a.kod)}</b> bakımı ${_S(-x.kalan)} ${a.sayac_tipi == 'saat' ? 'saat' : 'km'} gecikmiş.`]); else if (x.durum == 'yakin') L.push([4, `<b>${esc(a.kod)}</b> bakımına ${_S(x.kalan)} ${a.sayac_tipi == 'saat' ? 'saat' : 'km'} kaldı.`])});
  const B = OFIS.bekleyenIs(), bt = B.reduce((t, x) => t + x.tutar, 0); if (bt > 0) L.push([7, `${_P(bt)} tutarında iş hakedişe bağlanmamış (${B.length} iş) — hakediş kes. ${AS.git('hakedis', 'Hakedişler')}`]);
  const tas = VERI.liste('hakedis').filter(h => h.durum == 'taslak').length; if (tas) L.push([6, `${tas} hakediş taslakta bekliyor — onaylayıp faturala.`]);

    const nakil = Math.max(0, kazi - dolgu * 1.1), gev = nakil * z[1], sefer = N(s.kap) ? Math.ceil(gev / N(s.kap)) : 0, cyc = (N(s.hiz) ? 2 * N(s.mesafe) / N(s.hiz) : 0) + N(s.yuk) / 60;
    const eCap = N(s.eks) * N(s.ekap) * z[2], tCap = cyc ? N(s.kamyon) * N(s.kap) / cyc / z[1] : 0, prod = Math.min(eCap, tCap || eCap), saat = prod ? kazi / prod : 0;
    return {s, z, R, kazi, dolgu, nakil, gev, sefer, saat, gun: N(s.gun) ? Math.ceil(saat / N(s.gun)) : 0, darbogaz: tCap && tCap < eCap ? 'kamyon' : 'ekskavatör'}},
  kesit(k, w = 260, h = 120) {const L = N(k.tip == 'kanal' ? k.B : k.tip == 'kuyu' ? k.B : k.L) || 1, H = N(k.H) || 1, n = k.tip == 'kuyu' || k.tip == 'alan' ? 0 : N(k.n), ust = L + 2 * n * H, sk = Math.min((w - 40) / ust, (h - 34) / H), x0 = (w - ust * sk) / 2, y0 = 16;
    const P = [[x0, y0], [x0 + n * H * sk, y0 + H * sk], [x0 + (n * H + L) * sk, y0 + H * sk], [x0 + ust * sk, y0]].map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;display:block" role="img" aria-label="Kazı kesiti"><line x1="4" y1="${y0}" x2="${w - 4}" y2="${y0}" stroke="#8a6a45" stroke-width="2"/><polygon points="${P}" fill="rgba(138,106,69,.18)" stroke="#8a6a45" stroke-width="1.6"/><text x="${w / 2}" y="${y0 + H * sk + 14}" font-size="11" text-anchor="middle" fill="currentColor">taban ${_S(L, 2)} m · derinlik ${_S(H, 2)} m${n ? ` · şev 1:${_S(1 / n, 2)}` : ''}</text></svg>`},
  pdf(r) {const s = r.s; RAPOR.goster('Kazı hesabı' + (s.ad ? ' · ' + s.ad : ''), [`${RAPOR.ust('KAZI HACMİ HESABI', [`Tarih: ${tarihTR(bugun())}`, esc(s.ad || '')])}
    <div class="kutular">${RAPOR.kutu('ZEMİN', `<b>${esc(r.z[0])}</b><br>Kabarma katsayısı ${_S(r.z[1], 2)}`)}${RAPOR.kutu('SONUÇ', `Kazı (yerinde): <b>${_S(r.kazi)} m³</b><br>Nakil (kabarmış): <b>${_S(r.gev)} m³</b><br>${_S(r.sefer)} sefer · ${r.gun} iş günü`)}</div>
    <table class="r"><thead><tr><th>#</th><th>Kalem</th><th>Tip</th><th>Ölçüler</th><th class="n">Hacim (m³)</th></tr></thead><tbody>${r.R.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.k.ad || '')}</td><td>${esc(KAZI_TIP[x.k.tip])}</td><td>${esc(KAZI.olcu(x.k))} · ${esc(x.ust)}</td><td class="n">${x.k.tip == 'dolgu' ? '−' : ''}${_S(x.v, 1)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Nakledilecek (yerinde)</td><td class="n">${_S(r.nakil, 1)}</td></tr></tfoot></table>
    <h2>Kesitler</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${r.R.filter(x => x.k.tip != 'alan').map(x => `<div class="kt"><small>${esc(x.k.ad || KAZI_TIP[x.k.tip])}</small>${KAZI.kesit(x.k)}</div>`).join('')}</div>
    <h2>Uygulama</h2><p>${s.eks} ekskavatör (${s.ekap} m³/saat × zemin katsayısı ${_S(r.z[2], 2)}) ve ${s.kamyon} kamyon (${s.kap} m³, ${s.mesafe} km döküm) ile yaklaşık <b>${_S(r.saat, 1)} çalışma saati / ${r.gun} iş günü</b>. Darboğaz: ${r.darbogaz}.</p>
    <p style="font-size:8.4pt;color:#5b6f7c">Hacim prizmoidal formülle (V = H/6 · (A₁ + 4Aₘ + A₂)) hesaplanmıştır. Sahada dolgu olarak kullanılan hacim %10 sıkışma payıyla nakilden düşülmüştür. Değerler ön hesaptır; kesin metraj için aplikasyon ve kot ölçümü gerekir.</p>`])},
  olcu(k) {return k.tip == 'kuyu' ? `Ø${_S(k.B, 2)} × ${_S(k.H, 2)} m` : k.tip == 'alan' ? `${_S(k.L)} m²` : k.tip == 'kanal' ? `${_S(k.L, 1)} m × ${_S(k.B, 2)} m × ${_S(k.H, 2)} m` : `${_S(k.L, 2)} × ${_S(k.B, 2)} × ${_S(k.H, 2)} m`}
};

  belge: ['sigortası biten', 'muayenesi gelen araç', 'süresi dolacak evrak'], bordroSorgu: ['kime ne kadar maaş borcumuz var', 'maaş ödemeleri', 'avanslar'], filoOzet: ['kaç tane aracımız var', 'filomuzda ne var'], pdf: ['rapor çıkar', 'yazdırılabilir rapor', 'dosya olarak ver']
};
AS.tahmin = c => {
  const q = AS.torba(c.n); if (q.size < 1) return null; let en = null, ep = 0;
  Object.entries(AS.ORNEK).forEach(([ad, L]) => L.forEach(o => {const t = AS.torba(AS.nrm(o)), ort = [...q].filter(x => t.has(x) || [...t].some(y => (x.length >= 4 && y.startsWith(x)) || (y.length >= 4 && x.startsWith(y)))).length, p = ort / Math.max(2, Math.min(q.size, t.size) + .5 * Math.abs(q.size - t.size)); if (p > ep) {ep = p; en = {ad, o}}}));
  if (!en || ep < .45) return null;
  const it = AS.NIYET.find(x => x.ad == en.ad); if (!it || (it.ister && !it.ister(c))) return null;
  let r; try {r = it.f(c)} catch (e) {return null} if (!r) return null; AS.ctx = it.islem ? null : {ad: it.ad, c};
  return `<span class="not">“${esc(en.o)}” gibi anladım:</span><br>${r}`;
};

/* ---------- cevap akışı: sohbet → çoklu soru → kurallar ---------- */
AS.cevap1 = AS.cevap;
AS.bol = ham => {const P = ham.split(/\?\s+|\s*;\s*|\s+(?:ayrica|ayrıca|bir de|birde|sonra da|ve de)\s+/i).map(x => x.trim()).filter(x => x.length > 2); return P.length > 1 && P.length <= 4 ? P : [ham]};
AS.cevap = q => {
  const ham = String(q).trim(); if (!ham) return '';
  if (/^\s*(ö|o)(ğ|g)ret\b|^\s*unut\b/i.test(ham)) return AS.cevap1(ham);
  const P = AS.bol(ham);
  if (P.length > 1) return P.map(p => `<div style="margin-bottom:10px"><div class="not">› ${esc(p)}</div>${AS.tekCevap(p)}</div>`).join('');
  return AS.tekCevap(ham);
};
AS.tekCevap = ham => {const s = AS.sohbet(ham); if (s.tam) return s.h; const r = AS.cevap1(s.kalan && s.kalan != AS.nrm(ham) ? s.kalan : ham); return (s.sel ? s.sel + ' ' : '') + r};
{const s0 = AS.sor; AS.sor = q => {s0(q); const L = AS.log, x = L[L.length - 1]; if (x && !x.u && /^(Merhaba|Rica|Tamam|Görüşürüz|İyiyim|Buradayım|Ben NexDrive|NexDrive Engineering)/.test(x.h.replace(/<[^>]+>/g, ''))) x.pdf = false}}
