<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NexDrive Mimar · Mimari Çizim Stüdyosu</title>
<style>
:root{
  --lac:#0d1d2b; --lac2:#13283b; --lac3:#1a3550; --cizgi:#25445f; --tur:#3fc1c6; --tur2:#2a9da2;
  --yazi:#e9f2f7; --soluk:#8fa7ba; --kagit:#f6f8fb; --kirmizi:#e5534b; --sari:#e8b04a; --yesil:#4cc38a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--lac);color:var(--yazi);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#uygulama{display:grid;grid-template-rows:48px 38px 1fr 26px;grid-template-columns:76px 1fr 290px;height:100vh}
/* üst çubuk */
#ust{grid-column:1/4;overflow-x:auto;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--lac);border-bottom:1px solid var(--cizgi)}
#ust .marka{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
#ust .marka b{color:var(--tur);font-weight:700}
#ust .ayrac{width:1px;height:24px;background:var(--cizgi)}
#projeAd{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;min-width:160px;font-weight:600}
#projeAd:hover,#projeAd:focus{border-color:var(--cizgi);outline:none}
.sekmeler{display:flex;gap:2px;margin-left:auto;background:var(--lac2);border-radius:8px;padding:3px}
.sekmeler button{background:transparent;border:0;padding:6px 14px;border-radius:6px;color:var(--soluk);font-weight:600}
.sekmeler button.aktif{background:var(--tur);color:#062126}
.ubtn{background:var(--lac2);border:1px solid var(--cizgi);border-radius:7px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ubtn:hover{border-color:var(--tur)}
.ubtn.ana{background:var(--tur);color:#062126;border-color:var(--tur);font-weight:700}
.ubtn:disabled{opacity:.4;cursor:default}
/* seçenek çubuğu */
#secenek{grid-column:2/4;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--lac2);border-bottom:1px solid var(--cizgi);overflow-x:auto;white-space:nowrap}
#secenek label{display:inline-flex;align-items:center;gap:5px;color:var(--soluk)}
#secenek input[type=number]{width:62px}
#secenek .ipucu{color:var(--soluk);font-size:12px}
input[type=number],input[type=text],select,textarea{background:var(--lac);border:1px solid var(--cizgi);border-radius:6px;padding:4px 6px;color:var(--yazi)}
input:focus,select:focus{outline:none;border-color:var(--tur)}
/* sol araç çubuğu */
#araclar{grid-row:2/4;background:var(--lac);border-right:1px solid var(--cizgi);overflow-y:auto;padding:6px 6px 20px}
#araclar h6{margin:10px 0 4px;font-size:10px;color:var(--soluk);text-transform:uppercase;letter-spacing:.8px;text-align:center}
.arac{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:6px 2px;margin-bottom:3px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--yazi);font-size:10.5px;line-height:1.1}
.arac svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.arac:hover{background:var(--lac2)}
.arac.aktif{background:var(--lac3);border-color:var(--tur);color:var(--tur)}
.arac kbd{font-size:9px;color:var(--soluk)}
/* orta */
#orta{grid-row:3;grid-column:2;position:relative;overflow:hidden;background:var(--kagit)}
#orta canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c3d{background:#cfdde8}
.gorunum{position:absolute;inset:0;display:none}
.gorunum.aktif{display:block}
#gMetraj,#gPafta{overflow:auto;background:var(--lac);padding:18px 22px}
/* 3D araç çubuğu */
.yuzer{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px);z-index:2}
.yuzer .ubtn{background:rgba(13,29,43,.88);backdrop-filter:blur(4px)}
.yuzer .ubtn.aktif{background:var(--tur);color:#062126;border-color:var(--tur)}
.yuzer select,.yuzer input{background:rgba(13,29,43,.88)}
.yuzer label{display:inline-flex;align-items:center;gap:6px;background:rgba(13,29,43,.88);border:1px solid var(--cizgi);border-radius:7px;padding:4px 8px}
#gezIpucu{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(13,29,43,.85);padding:6px 12px;border-radius:8px;font-size:12px;display:none;z-index:2}
/* sağ panel */
#panel{grid-row:2/4;grid-column:3;background:var(--lac);border-left:1px solid var(--cizgi);overflow-y:auto}
#secenek{grid-column:2/3}
.kart{border-bottom:1px solid var(--cizgi);padding:10px 12px}
.kart h4{margin:0 0 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--tur);display:flex;align-items:center;justify-content:space-between}
.kart h4 button{font-size:11px;padding:2px 8px}
.alan{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.alan>span{color:var(--soluk);font-size:12px}
.alan input,.alan select{width:100%}
.satir{display:flex;gap:6px;flex-wrap:wrap}
.katlar .kat{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--cizgi);border-radius:7px;margin-bottom:5px;cursor:pointer}
.katlar .kat.aktif{border-color:var(--tur);background:var(--lac3)}
.katlar .kat span{flex:1}
.katlar .kat small{color:var(--soluk)}
.kutuphane{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kutuphane button{background:var(--lac2);border:1px solid var(--cizgi);border-radius:7px;padding:6px 3px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.kutuphane button canvas{width:46px;height:34px}
.kutuphane button.aktif{border-color:var(--tur);color:var(--tur)}
.bilgi{color:var(--soluk);font-size:12px}
.rozet{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700}
.rozet.iyi{background:rgba(76,195,138,.18);color:var(--yesil)}
.rozet.kotu{background:rgba(229,83,75,.18);color:var(--kirmizi)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini div{background:var(--lac2);border-radius:7px;padding:7px 8px}
.mini b{display:block;font-size:15px}
.mini small{color:var(--soluk);font-size:11px}
/* durum çubuğu */
#durum{grid-column:1/4;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--lac);border-top:1px solid var(--cizgi);color:var(--soluk);font-size:12px;white-space:nowrap;overflow:hidden}
#durum b{color:var(--yazi);font-weight:600}
/* metraj */
.mbaslik{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mbaslik h2{margin:0;font-size:20px}
.kpiler{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--lac2);border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px}
.kpi small{color:var(--soluk);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.kpi b{font-size:20px}
.kpi em{font-style:normal;color:var(--soluk);font-size:12px}
table.tbl{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:12.5px}
.tbl th{text-align:left;color:var(--soluk);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:7px 8px;border-bottom:1px solid var(--cizgi);background:var(--lac2);position:sticky;top:-18px}
.tbl td{padding:6px 8px;border-bottom:1px solid rgba(37,68,95,.55)}
.tbl td.s{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.grup td{background:var(--lac3);color:var(--tur);font-weight:700;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase}
.tbl tr.toplam td{font-weight:800;font-size:14px;border-top:2px solid var(--tur)}
.tbl input{width:100px;text-align:right}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1100px){.iki{grid-template-columns:1fr}}
h3.bol{margin:6px 0 8px;font-size:14px;color:var(--tur)}
/* pencere / diyalog */
#perde{position:fixed;inset:0;background:rgba(3,10,18,.6);display:none;align-items:center;justify-content:center;z-index:50}
#perde.acik{display:flex}
.diyalog{background:var(--lac2);border:1px solid var(--cizgi);border-radius:12px;width:min(560px,94vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.diyalog header{padding:14px 16px;border-bottom:1px solid var(--cizgi);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.diyalog .ic{padding:14px 16px}
.diyalog footer{padding:12px 16px;border-top:1px solid var(--cizgi);display:flex;gap:8px;justify-content:flex-end}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.plist div{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--cizgi);border-radius:8px}
.plist div span{flex:1;cursor:pointer}
.plist div span small{display:block;color:var(--soluk)}
.plist div.aktif{border-color:var(--tur)}
#bildirim{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--lac3);border:1px solid var(--tur);padding:8px 16px;border-radius:9px;z-index:60;display:none;max-width:80vw}
/* pafta önizleme */
#gPafta .sayfalar{display:flex;flex-direction:column;align-items:center;gap:18px}
.sayfa{width:297mm;height:210mm;background:#fff;color:#111;position:relative;box-shadow:0 6px 30px rgba(0,0,0,.4);overflow:hidden;flex:none}
.sayfa .cerceve{position:absolute;inset:7mm 7mm 7mm 17mm;border:0.5mm solid #111}
.sayfa .icerik{position:absolute;left:19mm;top:9mm;right:9mm;bottom:31mm;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sayfa .antet{position:absolute;right:7mm;bottom:7mm;width:150mm;height:22mm;border-top:0.4mm solid #111;border-left:0.4mm solid #111;display:grid;grid-template-columns:48mm 1fr 1fr 1fr;grid-template-rows:1fr 1fr;font-size:8pt}
.sayfa .antet div{border-right:0.2mm solid #111;border-bottom:0.2mm solid #111;padding:1mm 2mm;overflow:hidden}
.sayfa .antet div:nth-child(4n){border-right:0}
.sayfa .antet small{display:block;font-size:6pt;color:#555;text-transform:uppercase;letter-spacing:.3px}
.sayfa .antet .logo{grid-row:1/3;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1mm}
.sayfa .antet b{font-size:7.5pt;line-height:1.15;display:block}
.sayfa .baslikP{position:absolute;left:19mm;bottom:9mm;font-size:13pt;font-weight:700}
.sayfa .baslikP small{display:block;font-size:8pt;font-weight:400;color:#444}
.sayfa table{border-collapse:collapse;width:100%;font-size:7.5pt}
.sayfa th,.sayfa td{border:0.2mm solid #999;padding:0.8mm 1.5mm;text-align:left}
.sayfa td.s,.sayfa th.s{text-align:right}
.sayfa tr.grup td{background:#e8f4f5;font-weight:700}
.sayfa tr.toplam td{font-weight:800;background:#f1f1f1}
.sayfa .izgara{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:3mm;width:100%;height:100%}
.sayfa .izgara figure{margin:0;border:0.2mm solid #bbb;display:flex;flex-direction:column;overflow:hidden}
.sayfa .izgara figure img{flex:1;min-height:0;object-fit:contain;width:100%}
.sayfa .izgara figcaption{font-size:7.5pt;padding:0.8mm 2mm;border-top:0.2mm solid #bbb;font-weight:700}
#baski{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff;overflow:visible;height:auto}
  #uygulama,#perde,#bildirim{display:none!important}
  #baski{display:block}
  #baski .sayfa{box-shadow:none;page-break-after:always;break-after:page}
}
@media(max-width:900px){
  #uygulama{grid-template-columns:62px 1fr;grid-template-rows:48px 38px 1fr 220px 26px}
  #panel{grid-row:4;grid-column:1/3;border-left:0;border-top:1px solid var(--cizgi)}
  #araclar{grid-row:2/4;grid-column:1}
  #orta{grid-row:3;grid-column:2}
  #projeAd{min-width:110px;width:120px}
  #secenek{grid-column:2/3}
  #durum{grid-row:5}
  #ust .gizleM{display:none}
}
</style>

<script>
'use strict';
/* ================= Yardımcılar ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const kopya = o => JSON.parse(JSON.stringify(o));
const yuv = (v, s) => Math.round(v / s) * s;
const r3 = v => Math.round(v * 1000) / 1000;
const fmt = (v, d = 2) => Number(v || 0).toLocaleString('tr-TR', {minimumFractionDigits: d, maximumFractionDigits: d});
const tl = v => Number(v || 0).toLocaleString('tr-TR', {maximumFractionDigits: 0}) + ' ₺';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const tarihTR = (t = Date.now()) => new Date(t).toLocaleDateString('tr-TR');
const sinir = (v, a, b) => Math.max(a, Math.min(b, v));
const RAD = Math.PI / 180;

function bildir(m, sure = 2600) {
  const b = $('#bildirim'); b.textContent = m; b.style.display = 'block';
  clearTimeout(bildir._t); bildir._t = setTimeout(() => b.style.display = 'none', sure);
}

/* ================= Geometri ================= */
const G = {
  segNokta(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
    let t = L2 ? ((px - x1) * dx + (py - y1) * dy) / L2 : 0; t = sinir(t, 0, 1);
    const x = x1 + t * dx, y = y1 + t * dy;
    return {t, x, y, d: Math.hypot(px - x, py - y)};
  },
  alan(p) {let s = 0; for (let i = 0; i < p.length; i++) {const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]} return s / 2},
  cevre(p) {let s = 0; for (let i = 0; i < p.length; i++) {const a = p[i], b = p[(i + 1) % p.length]; s += Math.hypot(b[0] - a[0], b[1] - a[1])} return s},
  merkez(p) {
    const A = G.alan(p); if (Math.abs(A) < 1e-9) {let x = 0, y = 0; p.forEach(q => {x += q[0]; y += q[1]}); return [x / p.length, y / p.length]}
    let cx = 0, cy = 0;
    for (let i = 0; i < p.length; i++) {const a = p[i], b = p[(i + 1) % p.length], f = a[0] * b[1] - b[0] * a[1]; cx += (a[0] + b[0]) * f; cy += (a[1] + b[1]) * f}
    const c = [cx / (6 * A), cy / (6 * A)];
    return G.icinde(c[0], c[1], p) ? c : G.icNokta(p);
  },
  icNokta(p) { // çokgen içinde garanti bir nokta (yatay tarama)
    const b = G.bbox(p), y = (b.y1 + b.y2) / 2, xs = [];
    for (let i = 0; i < p.length; i++) {const a = p[i], c = p[(i + 1) % p.length]; if ((a[1] > y) != (c[1] > y)) xs.push(a[0] + (y - a[1]) / (c[1] - a[1]) * (c[0] - a[0]))}
    xs.sort((a, b) => a - b); let en = 0, x = (b.x1 + b.x2) / 2;
    for (let i = 0; i + 1 < xs.length; i += 2) if (xs[i + 1] - xs[i] > en) {en = xs[i + 1] - xs[i]; x = (xs[i] + xs[i + 1]) / 2}
    return [x, y];
  },
  icinde(x, y, p) {
    let ic = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      const a = p[i], b = p[j];
      if ((a[1] > y) != (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) ic = !ic;
    }
    return ic;
  },
  bbox(pts) {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const p of pts) {if (p[0] < x1) x1 = p[0]; if (p[0] > x2) x2 = p[0]; if (p[1] < y1) y1 = p[1]; if (p[1] > y2) y2 = p[1]}
    return {x1, y1, x2, y2, w: x2 - x1, h: y2 - y1};
  },
  ucgenle(p) { // kulak kırpma — indeks üçlüleri
    const n = p.length; if (n < 3) return [];
    const idx = [...Array(n).keys()]; if (G.alan(p) < 0) idx.reverse();
    const tri = [], cap = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const icUc = (P, a, b, c) => cap(a, b, P) >= -1e-12 && cap(b, c, P) >= -1e-12 && cap(c, a, P) >= -1e-12;
    let g = 0;
    while (idx.length > 3 && g < 5000) {
      g++; let kesti = false;
      for (let i = 0; i < idx.length; i++) {
        const ia = idx[(i + idx.length - 1) % idx.length], ib = idx[i], ic = idx[(i + 1) % idx.length];
        const a = p[ia], b = p[ib], c = p[ic];
        if (cap(a, b, c) <= 1e-12) continue;
        let bos = true;
        for (const j of idx) {if (j == ia || j == ib || j == ic) continue; const q = p[j]; if ((q[0] == a[0] && q[1] == a[1]) || (q[0] == b[0] && q[1] == b[1]) || (q[0] == c[0] && q[1] == c[1])) continue; if (icUc(q, a, b, c)) {bos = false; break}}
        if (!bos) continue;
        tri.push([ia, ib, ic]); idx.splice(i, 1); kesti = true; break;
      }
      if (!kesti) break;
    }
    if (idx.length == 3) tri.push([idx[0], idx[1], idx[2]]);
    return tri;
  },
  sadelestir(p, tol) { // kapalı çokgen Douglas–Peucker
    if (p.length < 4) return p;
    const dp = (a, lo, hi, out) => {
      let en = 0, ei = -1; const A = a[lo], B = a[hi];
      for (let i = lo + 1; i < hi; i++) {const d = G.segNokta(a[i][0], a[i][1], A[0], A[1], B[0], B[1]).d; if (d > en) {en = d; ei = i}}
      if (en > tol) {dp(a, lo, ei, out); dp(a, ei, hi, out)} else out.push(A);
    };
    // en uzak iki noktadan böl
    let u = 0; for (let i = 1; i < p.length; i++) if (Math.hypot(p[i][0] - p[0][0], p[i][1] - p[0][1]) > Math.hypot(p[u][0] - p[0][0], p[u][1] - p[0][1])) u = i;
    const a1 = p.slice(0, u + 1), a2 = p.slice(u).concat([p[0]]), out = [];
    dp(a1, 0, a1.length - 1, out); dp(a2, 0, a2.length - 1, out);
    return out;
  },
  donder(lx, ly, r) {const c = Math.cos(r * RAD), s = Math.sin(r * RAD); return [lx * c - ly * s, lx * s + ly * c]},
};

/* duvar ekleme: aynı doğrultudaki mevcut duvarlarla çakışan kısımları atlar */
function duvarEkle(katId, x1, y1, x2, y2, k, tur) {
  [x1, y1, x2, y2] = [x1, y1, x2, y2].map(r3);
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 0.05) return [];
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  let ar = [[0, L]];
  for (const w of P().duvarlar.filter(w => w.kat == katId)) {
    const d1 = Math.abs((w.x1 - x1) * uy - (w.y1 - y1) * ux), d2 = Math.abs((w.x2 - x1) * uy - (w.y2 - y1) * ux);
    if (d1 > 0.02 || d2 > 0.02) continue;
    let a = (w.x1 - x1) * ux + (w.y1 - y1) * uy, b = (w.x2 - x1) * ux + (w.y2 - y1) * uy; if (a > b) [a, b] = [b, a];
    ar = ar.flatMap(([s, e]) => {
      if (b <= s + 0.01 || a >= e - 0.01) return [[s, e]];
      const r = []; if (a > s + 0.05) r.push([s, a]); if (b < e - 0.05) r.push([b, e]); return r;
    });
  }
  return ar.map(([s, e]) => {
    const w = {id: uid(), kat: katId, x1: r3(x1 + ux * s), y1: r3(y1 + uy * s), x2: r3(x1 + ux * e), y2: r3(y1 + uy * e), k, tur};
    P().duvarlar.push(w); return w;
  });
}

/* ================= Oda algılama (taşma dolgusu) ================= */
function odaBul(katId, px, py, filtre) {
  const W = P().duvarlar.filter(w => w.kat == katId && (!filtre || filtre(w))); if (!W.length) return null;
  const pts = []; W.forEach(w => {pts.push([w.x1, w.y1]); pts.push([w.x2, w.y2])});
  const b = G.bbox(pts); b.x1 -= .5; b.y1 -= .5; b.x2 += .5; b.y2 += .5;
  if (px < b.x1 || px > b.x2 || py < b.y1 || py > b.y2) return {acik: true};
  let c = 0.05, nx = Math.ceil((b.x2 - b.x1) / c), ny = Math.ceil((b.y2 - b.y1) / c);
  while (nx * ny > 3e6) {c *= 1.5; nx = Math.ceil((b.x2 - b.x1) / c); ny = Math.ceil((b.y2 - b.y1) / c)}

    const j0 = Math.max(0, Math.floor((Math.min(w.y1, w.y2) - r - b.y1) / c)), j1 = Math.min(ny - 1, Math.ceil((Math.max(w.y1, w.y2) + r - b.y1) / c));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const x = b.x1 + (i + .5) * c, y = b.y1 + (j + .5) * c;
      if (G.segNokta(x, y, w.x1, w.y1, w.x2, w.y2).d <= r) g[j * nx + i] = 1;
    }
  }
  const si = Math.floor((px - b.x1) / c), sj = Math.floor((py - b.y1) / c);
  if (g[sj * nx + si]) return {duvar: true};
  const q = new Int32Array(nx * ny); let h = 0, t = 0; q[t++] = sj * nx + si; g[sj * nx + si] = 2; let sayi = 0;
  while (h < t) {

    if (i == 0 || j == 0 || i == nx - 1 || j == ny - 1) return {acik: true};
    for (const n of [k - 1, k + 1, k - nx, k + nx]) if (!g[n]) {g[n] = 2; q[t++] = n}
  }

  const kenar = new Map(), ekle = (a, bb) => {const ka = a[0] + ',' + a[1]; (kenar.get(ka) || kenar.set(ka, []).get(ka)).push(bb)};
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    if (g[j * nx + i] != 2) continue;
    if (g[(j - 1) * nx + i] != 2) ekle([i, j], [i + 1, j]);
    if (g[j * nx + i + 1] != 2) ekle([i + 1, j], [i + 1, j + 1]);
    if (g[(j + 1) * nx + i] != 2) ekle([i + 1, j + 1], [i, j + 1]);
    if (g[j * nx + i - 1] != 2) ekle([i, j + 1], [i, j]);
  }
  const donguler = [];
  for (const [ka, list] of kenar) {
    while (list.length) {
      const bas = ka.split(',').map(Number), d = [bas]; let cur = list.pop(), sinirr = 0;
      while (sinirr++ < 200000) {
        if (cur[0] == bas[0] && cur[1] == bas[1]) break;
        d.push(cur); const l = kenar.get(cur[0] + ',' + cur[1]); if (!l || !l.length) break; cur = l.pop();
      }
      donguler.push(d);
    }

  let en = null, ea = 0;
  for (const d of donguler) {const a = Math.abs(G.alan(d)); if (a > ea) {ea = a; en = d}}
  if (!en) return null;
  // eşdoğrusal noktaları at
  let p = en.map(v => [b.x1 + v[0] * c, b.y1 + v[1] * c]);
  const temiz = [];
  for (let i = 0; i < p.length; i++) {
    const a = p[(i + p.length - 1) % p.length], m = p[i], z = p[(i + 1) % p.length];
    if (Math.abs((m[0] - a[0]) * (z[1] - a[1]) - (m[1] - a[1]) * (z[0] - a[0])) > 1e-9) temiz.push(m);

  p = dikHizala(G.sadelestir(temiz, c * 1.6)).map(v => [r3(v[0]), r3(v[1])]);

/* yakın x / y değerlerini birleştir: neredeyse dik kenarları tam dik yap */

/* delikli çokgeni köprüyle tek çokgene çevir (kulak kırpma için) */
function delikli(dis, delikler) {
  let o = G.alan(dis) > 0 ? dis.slice() : dis.slice().reverse();
  const hs = delikler.map(h => G.alan(h) > 0 ? h.slice().reverse() : h.slice()).filter(h => h.length >= 3 && h.every(q => G.icinde(q[0], q[1], o)));
  hs.sort((a, b) => Math.max(...b.map(q => q[0])) - Math.max(...a.map(q => q[0])));
  for (const h of hs) {
    let mi = 0; h.forEach((q, i) => {if (q[0] > h[mi][0]) mi = i}); const M = h[mi];
    let en = Infinity, ei = -1;
    for (let i = 0; i < o.length; i++) {
      const a = o[i], b = o[(i + 1) % o.length];
      if ((a[1] > M[1]) == (b[1] > M[1])) continue;
      const x = a[0] + (M[1] - a[1]) / (b[1] - a[1]) * (b[0] - a[0]);
      if (x >= M[0] && x - M[0] < en) {en = x - M[0]; ei = a[0] > b[0] ? i : (i + 1) % o.length}
    }
    if (ei < 0) continue;
    const hd = h.slice(mi).concat(h.slice(0, mi)); hd.push(M);
    o = o.slice(0, ei + 1).concat(hd, [o[ei]], o.slice(ei + 1));
  }
  return o;
}
/* ortogonal çokgeni (üst üste binebilen) en büyük dikdörtgenlere ayır — çatı için */
function dikdortgenlere(pts) {
  for (let i = 0; i < pts.length; i++) {const a = pts[i], b = pts[(i + 1) % pts.length]; if (Math.abs(a[0] - b[0]) > .02 && Math.abs(a[1] - b[1]) > .02) return null}
  const tek = v => [...new Set(v.map(x => Math.round(x * 100) / 100))].sort((a, b) => a - b);
  const xs = tek(pts.map(q => q[0])), ys = tek(pts.map(q => q[1])), nx = xs.length - 1, ny = ys.length - 1;
  if (nx < 1 || ny < 1 || nx * ny > 900) return null;
  const ic = [], ort = [];
  for (let i = 0; i < nx; i++) {ic.push([]); for (let j = 0; j < ny; j++) ic[i].push(G.icinde((xs[i] + xs[i + 1]) / 2, (ys[j] + ys[j + 1]) / 2, pts) ? 1 : 0)}
  const dolu = (i0, i1, j0, j1) => {for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) if (!ic[i][j]) return false; return true};
  const kapli = ic.map(r => r.map(() => 0)), sonuc = [];
  for (let g = 0; g < 50; g++) {
    let en = null, ea = 0;
    for (let i0 = 0; i0 < nx; i0++) for (let j0 = 0; j0 < ny; j0++) {
      if (!ic[i0][j0]) continue;
      for (let i1 = i0; i1 < nx && ic[i1][j0]; i1++) for (let j1 = j0; j1 < ny; j1++) {
        if (!dolu(i0, i1, j0, j1)) break;
        let yeni = false; for (let i = i0; i <= i1 && !yeni; i++) for (let j = j0; j <= j1; j++) if (!kapli[i][j]) {yeni = true; break}
        const a = (xs[i1 + 1] - xs[i0]) * (ys[j1 + 1] - ys[j0]);

    const [i0, i1, j0, j1] = en; for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) kapli[i][j] = 1;
    sonuc.push({x1: xs[i0], x2: xs[i1 + 1], y1: ys[j0], y2: ys[j1 + 1]});

/* ================= Metraj & maliyet ================= */
function metrajHesap() {
  const p = P(), F = p.fiyat, satir = [], odalar = [], dograma = [], katOzet = [];
  const ekle = (grup, ad, miktar, birim, fk, not) => {if (miktar > 0.0001) satir.push({grup, ad, miktar, birim, fk, not, fiyat: fk && F[fk] ? F[fk].f : 0})};
  let toplamNet = 0, toplamBrut = 0, zeminBrut = 0;
  const z = {}; let disNet = 0, icYuzey = 0, duvarSer = 0, supur = 0, tavan = 0, blok = {}, kapiIc = 0, kapiDis = 0, penM2 = 0, balM2 = 0, betonM3 = 0;
  p.katlar.forEach((K, i) => {
    const W = p.duvarlar.filter(w => w.kat == K.id), O = p.odalar.filter(o => o.kat == K.id);
    let net = 0, iz = 0;
    O.forEach(o => {
      const a = Math.abs(G.alan(o.pts)), c = G.cevre(o.pts); net += a;
      z[o.zemin] = (z[o.zemin] || 0) + a; tavan += a;
      const islak = ISLAK(o.ad), duvarA = c * K.h;
      if (islak) duvarSer += c * Math.min(K.h, 2.6) * .85;
      else supur += c;
      odalar.push({kat: K.ad, ad: o.ad, zemin: (ZEMIN[o.zemin] || {}).ad || o.zemin, alan: a, cevre: c, duvar: duvarA});
    });
    W.forEach(w => {
      const L = duvarBoy(w); iz += L * w.k;
      const A = p.aciklar.filter(a => a.duvar == w.id), acik = A.reduce((s, a) => s + a.g * a.h, 0), n = Math.max(0, L * K.h - acik);
      const mal = w.tur == 'dis' ? p.cephe.malzeme : p.cephe.icMalzeme; blok[mal] = (blok[mal] || 0) + n;
      if (w.tur == 'dis') {disNet += n; icYuzey += n} else icYuzey += 2 * n;
      A.forEach(a => {
        if (a.tur == 'pencere') penM2 += a.g * a.h; else if (a.tur == 'balkon') balM2 += a.g * a.h; else if (w.tur == 'dis') kapiDis++; else kapiIc++;
        dograma.push({kat: K.ad, tur: a.tur == 'pencere' ? 'Pencere' : a.tur == 'balkon' ? 'Balkon kapısı' : (w.tur == 'dis' ? 'Dış kapı' : 'İç kapı'), g: a.g, h: a.h, p: a.p});
      });
    });
    const brut = net + iz; toplamNet += net; toplamBrut += brut; if (i == 0) zeminBrut = brut;
    betonM3 += brut * K.d;
    katOzet.push({ad: K.ad, net, brut, h: K.h});
  });
  // kaba yapı
  const G1 = 'Kaba yapı';
  for (const [m, a] of Object.entries(blok)) {const B = BLOK[m] || BLOK.gazbeton; ekle(G1, B.ad, Math.ceil(a * B.m2 * 1.05), 'adet', B.fk, fmt(a, 1) + ' m² duvar, %5 fire')}
  const temelA = zeminBrut ? (() => {const W = p.duvarlar.filter(w => w.kat == p.katlar[0].id); const pts = []; W.forEach(w => pts.push([w.x1, w.y1], [w.x2, w.y2])); const b = G.bbox(pts); return {w: b.w + .5, h: b.h + .5}})() : null;
  const radye = temelA ? temelA.w * temelA.h * .5 : 0;
  ekle(G1, 'Döşeme betonu', betonM3, 'm³', 'beton', 'kat brüt alanı × döşeme kalınlığı');
  ekle(G1, 'Radye temel betonu', radye, 'm³', 'beton', '50 cm radye, tahmini');
  ekle(G1, 'İnşaat demiri (tahmini)', (betonM3 + radye) * 100, 'kg', 'demir', '≈100 kg/m³ beton — statik projeye göre değişir');
  // kolon & kiriş
  {
    let kb = 0, kL = 0;
    p.katlar.forEach(K => {p.mobilya.filter(o => o.kat == K.id && o.tip == 'kolon').forEach(o => {const {w, d} = mobOlcu(o); kb += w * d * K.h}); kirisListesi(K.id).forEach(k => {kL += k.L; kb += k.L * .25 * .5})});
    ekle(G1, 'Kolon + kiriş betonu', kb, 'm³', 'kolon_kiris', kL ? `kiriş ${fmt(kL, 1)} m (25×50)` : 'kolonlar');
    if (kb) ekle(G1, 'Kolon + kiriş demiri (tahmini)', kb * 140, 'kg', 'demir', '≈140 kg/m³');
  }
  // hafriyat
  const G2 = 'Hafriyat & temel', hf = ARAZI.hafriyat();
  if (hf) {
    const net = hf.yarma - hf.dolgu, kab = Math.max(0, net) * p.ayar.kabarma;
    ekle(G2, 'Kazı (yarma)', hf.yarma, 'm³', 'hafriyat', ARAZI.var() ? `arazi kotlarından · temel tabanı ${fmt(hf.taban)} · ±0.00 = ${fmt(ARAZI.binaKot())}` : `${fmt(hf.alan, 1)} m² × ${fmt(p.ayar.temelDerinlik, 1)} m (her yandan 1 m çalışma payı)`);
    if (hf.dolgu > .05) satir.push({grup: G2, ad: 'Dolgu (kazıdan kullanılan)', miktar: Math.min(hf.dolgu, hf.yarma), birim: 'm³', fk: null, not: 'bina oturma kotuna kadar', fiyat: 0, bilgi: true});
    if (hf.dolgu > hf.yarma) ekle(G2, 'Dışarıdan dolgu malzemesi', hf.dolgu - hf.yarma, 'm³', 'dis_dolgu', 'kazı dolguya yetmiyor');
    satir.push({grup: G2, ad: 'Taşınacak hafriyat / kamyon seferi', miktar: Math.ceil(kab / p.ayar.kamyon), birim: 'sefer', fk: null, not: `${fmt(kab, 1)} m³ kabarmış (×${fmt(p.ayar.kabarma)}), ${p.ayar.kamyon} m³ kamyon`, fiyat: 0, bilgi: true});
  }
  // ince yapı
  const G3 = 'İnce yapı';
  ekle(G3, 'İç sıva', icYuzey + tavan, 'm²', 'siva_ic', 'duvar iç yüzleri + tavan');
  ekle(G3, 'Dış sıva', disNet, 'm²', 'siva_dis');
  if (p.cephe.mantolama) ekle(G3, 'Mantolama (ısı yalıtımı)', disNet, 'm²', 'mantolama');
  ekle(G3, 'İç boya (2 kat)', Math.ceil((icYuzey - duvarSer + tavan) * 2 / 10), 'lt', 'boya', '≈10 m²/lt/kat');
  ekle(G3, 'Dış cephe boyası (2 kat)', Math.ceil(disNet * 2 / 8), 'lt', 'dis_boya', '≈8 m²/lt/kat');
  for (const [k, a] of Object.entries(z)) ekle(G3, (ZEMIN[k] || {}).ad + ' (zemin)', a * 1.1, 'm²', zeminFiyatKey(k), '%10 fire');
  ekle(G3, 'Duvar seramiği (ıslak hacim)', duvarSer * 1.1, 'm²', 'duvar_seramik', 'banyo/WC duvarları, %10 fire');
  ekle(G3, 'Süpürgelik', supur, 'm', 'supurgelik');
  // doğrama
  const G4 = 'Doğrama';
  ekle(G4, 'İç kapı', kapiIc, 'adet', 'kapi_ic'); ekle(G4, 'Dış kapı', kapiDis, 'adet', 'kapi_dis');
  ekle(G4, 'Pencere', penM2, 'm²', 'pencere'); ekle(G4, 'Balkon kapısı', balM2, 'm²', 'balkon');
  // çatı
  const G5 = 'Çatı';
  const son = p.katlar[p.katlar.length - 1], Ws = p.duvarlar.filter(w => w.kat == son.id);
  if (Ws.length) {
    const pts = []; Ws.forEach(w => pts.push([w.x1, w.y1], [w.x2, w.y2])); const b = G.bbox(pts), c = p.cati;
    if (c.tip == 'duz') ekle(G5, 'Teras çatı yalıtımı', p.odalar.filter(o => o.kat == son.id).reduce((s, o) => s + Math.abs(G.alan(o.pts)), 0), 'm²', 'teras');
    else {const pa = (b.w + .3 + 2 * c.sacak) * (b.h + .3 + 2 * c.sacak); ekle(G5, CATI[c.tip] + ` (${c.egim}°)`, pa / Math.cos(c.egim * RAD), 'm²', 'cati', `plan alanı ${fmt(pa, 1)} m², saçak ${fmt(c.sacak)} m`)}
  }
  // peyzaj
  const G6 = 'Peyzaj & dış mekân', D = p.dis, top = t => D.filter(d => d.tip == t).reduce((s, d) => s + d.w * d.d, 0);
  ekle(G6, 'Çim', top('cim'), 'm²', 'cim'); ekle(G6, 'Kaldırım / yol', top('yol'), 'm²', 'yol'); ekle(G6, 'Otopark', top('otopark'), 'm²', 'otopark'); ekle(G6, 'Havuz', top('havuz'), 'm²', 'havuz', 'havuz su hacmi ≈ ' + fmt(top('havuz') * 1.5, 1) + ' m³ (1,5 m)');
  ekle(G6, 'Ağaç', D.filter(d => d.tip == 'agac').length, 'adet', 'agac'); ekle(G6, 'Çalı / süs bitkisi', D.filter(d => d.tip == 'cali').length, 'adet', 'cali');
  ekle(G6, 'Çevre duvarı / çit', D.filter(d => d.tip == 'cit').reduce((s, d) => s + Math.hypot(d.x2 - d.x1, d.y2 - d.y1), 0), 'm', 'cit');
  tesisatMetraj(ekle);
  satir.forEach(r => r.tutar = r.bilgi ? 0 : r.miktar * (r.fiyat || 0));
  const toplam = satir.reduce((s, r) => s + r.tutar, 0);
  const arsaA = p.arsa ? Math.abs(G.alan(p.arsa.pts)) : 0;
  return {satir, odalar, dograma, katOzet, toplam, toplamNet, toplamBrut, zeminBrut, arsaA, taks: arsaA ? zeminBrut / arsaA : 0, kaks: arsaA ? toplamBrut / arsaA : 0};
}

    p.mobilya.filter(m => m.kat == K.id).forEach(m => {const {w, d} = mobOlcu(m); poly(pre + 'MOBILYA', [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(q => {const t = G.donder(q[0], q[1], m.r || 0); return [X(m.x + t[0]), m.y + t[1]]}))});
    if (ki == 0) {
      if (p.arsa) poly('ARSA', p.arsa.pts.map(q => [X(q[0]), q[1]]));
      p.dis.forEach(d => {if (d.x1 != null) LINE('PEYZAJ', X(d.x1), d.y1, X(d.x2), d.y2); else if (d.w != null) poly('PEYZAJ', [[-d.w / 2, -d.d / 2], [d.w / 2, -d.d / 2], [d.w / 2, d.d / 2], [-d.w / 2, d.d / 2]].map(q => {const t = G.donder(q[0], q[1], d.r || 0); return [X(d.x + t[0]), d.y + t[1]]})); else e.push('0', 'CIRCLE', '8', 'PEYZAJ', '10', n(X(d.x)), '20', n(-d.y), '30', '0', '40', n((d.cap || 1) / 2))});
    }
    ox += (pts.length ? b.w : 10) + (ki == 0 && p.arsa ? Math.max(0, G.bbox(p.arsa.pts).x2 - b.x2) + 10 : 6);
  });
  return ['0', 'SECTION', '2', 'HEADER', '9', '$INSUNITS', '70', '6', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES', ...e, '0', 'ENDSEC', '0', 'EOF'].join('\r\n');
}

/* ================= Ek: pano (kopyala/yapıştır), ok tuşuyla kaydırma, oto ölçü, geometri kontrolü ================= */
const PANO = {
  v: null,
  kopyala(sessiz) {
    const s = S.secili, o = s && PLAN.nesne(s), p = P();
    if (!o || s.tur == 'arsa') {if (!sessiz) bildir('Önce kopyalanacak bir öğe seç'); return false}
    const v = {tur: s.tur, o: kopya(o), kat: o.kat ?? S.katId, n: 0};
    if (s.tur == 'duvar') v.aciklar = p.aciklar.filter(a => a.duvar == o.id).map(kopya);
    this.v = v; if (!sessiz) bildir('Kopyalandı · Ctrl+V: yapıştır (başka kata da yapıştırabilirsin)'); return true;
  },
  yapistir() {
    const v = this.v, p = P(); if (!v) return bildir('Pano boş — önce Ctrl+C ile bir öğe kopyala');
    const ayniKat = v.kat == S.katId, d = ayniKat ? r3(.5 * (v.n + 1)) : 0, c = kopya(v.o); c.id = uid();
    if (c.kat != null) c.kat = S.katId;
    if (v.tur == 'acik') {
      const w = duvar(c.duvar); if (!w) return bildir('Kapı/pencerenin duvarı artık yok');
      const L = duvarBoy(w), ara = (c.g + .3) * (v.n + 1);
      let t = (c.t * L + ara + c.g / 2 <= L) ? c.t * L + ara : c.t * L - ara;
      if (t - c.g / 2 < 0 || t + c.g / 2 > L) return bildir('Bu duvarda yeni açıklık için yer yok');
      c.t = r3(t / L);
    } else if (v.tur == 'aks') c.k = r3(c.k + d);
    else if (c.x1 != null) {c.x1 = r3(c.x1 + d); c.y1 = r3(c.y1 + d); c.x2 = r3(c.x2 + d); c.y2 = r3(c.y2 + d)}
    else if (c.pts) c.pts = c.pts.map(q => [r3(q[0] + d), r3(q[1] + d)]);
    else {c.x = r3(c.x + d); c.y = r3(c.y + d)}
    const t = {duvar: 'duvarlar', acik: 'aciklar', mobilya: 'mobilya', oda: 'odalar', dis: 'dis', olcu: 'olculer', yazi: 'yazilar', aks: 'akslar', kesit: 'kesitler', tesisat: 'tesisat'}[v.tur];
    degistir(() => {
      p[t].push(c);
      if (v.tur == 'duvar') (v.aciklar || []).forEach(a => p.aciklar.push({...kopya(a), id: uid(), duvar: c.id}));
      S.secili = {tur: v.tur, id: c.id};
    });
    if (ayniKat || v.tur == 'acik') v.n++;
    bildir(ayniKat ? 'Yapıştırıldı' : 'Yapıştırıldı → ' + kat().ad + ' (aynı konuma)');
  },
  cogalt() {const eski = this.v; if (this.kopyala(true)) {this.yapistir(); this.v = eski}}
};

let _iteleSon = 0;
function itele(dx, dy) {
  const s = S.secili, o = s && PLAN.nesne(s); if (!o) return false;
  const simdi = Date.now(); if (simdi - _iteleSon > 700) GECMIS.kaydet(); _iteleSon = simdi; // ardışık basışlar tek geri alma adımı
  if (s.tur == 'acik') {
    const w = duvar(o.duvar); if (!w) return true; const L = duvarBoy(w), ux = (w.x2 - w.x1) / L, uy = (w.y2 - w.y1) / L, m = dx * ux + dy * uy;
    if (Math.abs(m) < 1e-9) return true;
    o.t = Math.round(sinir(o.t * L + m, o.g / 2, L - o.g / 2) / L * 1e6) / 1e6; // r3 uzun duvarda mm taşma yapar
  } else if (s.tur == 'aks') o.k = r3(o.k + (o.yon == 'd' ? dx : dy));
  else if (o.x1 != null) {o.x1 = r3(o.x1 + dx); o.y1 = r3(o.y1 + dy); o.x2 = r3(o.x2 + dx); o.y2 = r3(o.y2 + dy)}
  else if (o.pts) o.pts = o.pts.map(q => [r3(q[0] + dx), r3(q[1] + dy)]);
  else {o.x = r3(o.x + dx); o.y = r3(o.y + dy)}
  S.d3Kirli = true; kaydetGecikmeli(); yenilePanel(); PLAN.ciz();
  return true;
}

/* dış duvarlar boyunca kapı/pencere ölçü zinciri — p.olculer'e {oto:true} olarak eklenir, tekrar çalıştırınca yenilenir */
function otoOlcuUret(katId) {
  const p = P(), W = p.duvarlar.filter(w => w.kat == katId && w.tur == 'dis'), yeni = [];
  if (!W.length) return yeni;
  const pts = W.flatMap(w => [[w.x1, w.y1], [w.x2, w.y2]]), b = G.bbox(pts), mx = b.x1 + b.w / 2, my = b.y1 + b.h / 2;
  W.forEach(w => {
    const L = duvarBoy(w); if (L < .3) return;
    const A = p.aciklar.filter(a => a.duvar == w.id); if (!A.length) return;
    const ux = (w.x2 - w.x1) / L, uy = (w.y2 - w.y1) / L; let nx = -uy, ny = ux;
    if (((w.x1 + w.x2) / 2 - mx) * nx + ((w.y1 + w.y2) / 2 - my) * ny < 0) {nx = -nx; ny = -ny}
    const off = w.k / 2 + .7, s = [0, L];
    A.forEach(a => s.push(sinir(a.t * L - a.g / 2, 0, L), sinir(a.t * L + a.g / 2, 0, L)));
    const u = [...new Set(s.map(v => Math.round(v * 1000) / 1000))].sort((x, y) => x - y);
    for (let i = 0; i < u.length - 1; i++) {
      if (u[i + 1] - u[i] < .05) continue;
      const P1 = [w.x1 + ux * u[i] + nx * off, w.y1 + uy * u[i] + ny * off], P2 = [w.x1 + ux * u[i + 1] + nx * off, w.y1 + uy * u[i + 1] + ny * off];
      yeni.push({id: uid(), kat: katId, oto: true, x1: r3(P1[0]), y1: r3(P1[1]), x2: r3(P2[0]), y2: r3(P2[1])});
    }
  });
  return yeni;
}
function otoOlcu() {
  const y = otoOlcuUret(S.katId);
  if (!y.length) return bildir('Bu katta kapı/pencereli dış duvar yok');
  degistir(() => {const p = P(); p.olculer = p.olculer.filter(q => !(q.oto && q.kat == S.katId)); p.olculer.push(...y)});
  S.olcuGoster = true; bildir(y.length + ' ölçü eklendi (açıklık zinciri)');
}
function otoOlcuSil() {
  const n = P().olculer.filter(q => q.oto && q.kat == S.katId).length; if (!n) return bildir('Bu katta otomatik ölçü yok');
  degistir(() => P().olculer = P().olculer.filter(q => !(q.oto && q.kat == S.katId))); bildir(n + ' otomatik ölçü silindi');
}

/* segmentin döndürülmüş dikdörtgenin içinden geçip geçmediği (Liang–Barsky) */
function segDikdortgen(x1, y1, x2, y2, cx, cy, w, d, r, pay = .02) {
  const a = G.donder(x1 - cx, y1 - cy, -(r || 0)), b = G.donder(x2 - cx, y2 - cy, -(r || 0)), hx = w / 2 - pay, hy = d / 2 - pay;
  if (hx <= 0 || hy <= 0) return false;
  let t0 = 0, t1 = 1; const dx = b[0] - a[0], dy = b[1] - a[1];
  for (const [pp, q] of [[-dx, a[0] + hx], [dx, hx - a[0]], [-dy, a[1] + hy], [dy, hy - a[1]]]) {
    if (Math.abs(pp) < 1e-12) {if (q < 0) return false; continue}
    const t = q / pp; if (pp < 0) {if (t > t1) return false; if (t > t0) t0 = t} else {if (t < t0) return false; if (t < t1) t1 = t}
  }
  return t1 - t0 > 1e-6;
}
function geometriKontrol(ekle, katAd) {
  const p = P(), cok = p.katlar.length > 1, on = id => cok ? katAd(id) + ' · ' : '';
  p.duvarlar.forEach(w => {if (duvarBoy(w) < .05) ekle('hata', `${on(w.kat)}Çok kısa duvar (${fmt(duvarBoy(w) * 100, 0)} cm) — silinmeli`, {tur: 'duvar', id: w.id}, w.kat, [w.x1, w.y1])});
  // üst üste binen duvarlar
  p.katlar.forEach(K => {
    const D = p.duvarlar.filter(w => w.kat == K.id && duvarBoy(w) >= .05);
    for (let i = 0; i < D.length; i++) for (let j = i + 1; j < D.length; j++) {
      const a = D[i], b = D[j], L = duvarBoy(a), ux = (a.x2 - a.x1) / L, uy = (a.y2 - a.y1) / L;
      const dik = q => Math.abs((q[0] - a.x1) * -uy + (q[1] - a.y1) * ux), boy = q => (q[0] - a.x1) * ux + (q[1] - a.y1) * uy;
      if (dik([b.x1, b.y1]) > .02 || dik([b.x2, b.y2]) > .02) continue;
      const s0 = Math.min(boy([b.x1, b.y1]), boy([b.x2, b.y2])), s1 = Math.max(boy([b.x1, b.y1]), boy([b.x2, b.y2])), ort = Math.min(L, s1) - Math.max(0, s0);
      if (ort > .05) {const m = Math.max(0, s0) + ort / 2; ekle('hata', `${on(K.id)}Üst üste binen duvarlar (${fmt(ort)} m) — metraj iki kez sayar`, {tur: 'duvar', id: b.id}, K.id, [a.x1 + ux * m, a.y1 + uy * m])}
    }
  });
  // açıklıklar: duvar dışına taşma ve birbirine binme
  p.duvarlar.forEach(w => {
    const L = duvarBoy(w); if (L < .05) return;
    const A = p.aciklar.filter(a => a.duvar == w.id).map(a => ({a, s: a.t * L - a.g / 2, e: a.t * L + a.g / 2})).sort((x, y) => x.s - y.s);
    const ad = a => ({kapi: 'Kapı', pencere: 'Pencere', balkon: 'Balkon kapısı'}[a.tur] || 'Açıklık'), nk = x => [w.x1 + (w.x2 - w.x1) * x.a.t, w.y1 + (w.y2 - w.y1) * x.a.t];
    A.forEach((x, i) => {
      if (x.s < -.005 || x.e > L + .005) ekle('hata', `${on(w.kat)}${ad(x.a)} (${fmt(x.a.g * 100, 0)} cm) duvar boyunu (${fmt(L)} m) taşıyor`, {tur: 'acik', id: x.a.id}, w.kat, nk(x));
      const y = A[i + 1]; if (y && y.s < x.e - .005) ekle('hata', `${on(w.kat)}${ad(x.a)} ile ${ad(y.a).toLocaleLowerCase('tr')} üst üste biniyor`, {tur: 'acik', id: y.a.id}, w.kat, nk(y));
    });
  });
  // duvarın içine giren mobilya
  p.mobilya.forEach(m => {
    const T = MOB[m.tip]; if (!T || T.ozel == 'kolon') return; const {w, d} = mobOlcu(m);
    const hit = p.duvarlar.find(x => x.kat == m.kat && segDikdortgen(x.x1, x.y1, x.x2, x.y2, m.x, m.y, w, d, m.r, .05));
    if (hit) ekle('uyari', `${on(m.kat)}${T.ad} bir duvarın içine taşıyor`, {tur: 'mobilya', id: m.id}, m.kat, [m.x, m.y]);
  });
}

    r.readAsText(f);
  };
  $('#dosyaResim').onchange = e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => {const img = new Image(); img.onload = () => {

      const [wx, wy] = PLAN.dunya(40, 40);
      degistir(() => P().altlik = {src: c.toDataURL('image/jpeg', .72), x: r3(wx), y: r3(wy), olcek: 15 / c.width, opak: .5});
      bildir('Altlık yüklendi — bilinen bir ölçüyü “Ölçekle” ile işaretle', 4500); aracSec('kalibre');
    }; img.src = r.result};
    r.readAsDataURL(f); e.target.value = '';
  };
  document.addEventListener('keydown', e => {
    if ($('#perde').classList.contains('acik')) {if (e.key == 'Escape') $('#diyalog')._kapat && $('#diyalog')._kapat(null); return}
    if (!P()) return;
    const yaz = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() == 'z' && !yaz) {e.preventDefault(); e.shiftKey ? GECMIS.ileri() : GECMIS.geri(); return}
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() == 'y' && !yaz) {e.preventDefault(); GECMIS.ileri(); return}
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() == 's') {e.preventDefault(); DEPO.kaydet(); bildir('Kaydedildi'); return}
    if (yaz) return;
    if (S.gorunum == '3d') {D3.tuslar.add(e.key.toLowerCase()); if (e.shiftKey) D3.tuslar.add('shift'); if (D3.mod == 'gez' && /^(w|a|s|d|q|e|arrow)/i.test(e.key)) {e.preventDefault(); D3.iste()} return}
    if (S.gorunum != 'plan') return;
    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
      const kk = e.key.toLowerCase();
      if (kk == 'c') {if (PANO.kopyala()) e.preventDefault(); return}
      if (kk == 'v') {e.preventDefault(); PANO.yapistir(); return}
      if (kk == 'd') {e.preventDefault(); if (S.secili) PANO.cogalt(); return}
    }
    if (/^Arrow/.test(e.key) && S.secili && !PLAN.zincir && !PLAN.surukle) {
      const st = e.shiftKey ? .5 : e.altKey ? .01 : Math.max(.01, S.grid), v = {ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st]}[e.key];
      if (v && itele(v[0], v[1])) {e.preventDefault(); return}
    }
    if (PLAN.tus(e)) {e.preventDefault(); return}
    if (e.key == ' ') {PLAN.bosluk = true; PLAN.cv.style.cursor = 'grab'; e.preventDefault(); return}
    if (e.key == 'Delete' || e.key == 'Backspace') {seciliSil(); e.preventDefault(); return}
    const k = e.key.toLocaleLowerCase('tr');
    if (k == 'r') {
      if (S.secili && S.secili.tur == 'tesisat') {const o = PLAN.nesne(S.secili); if (o) degistir(() => o.r = ((o.r || 0) + 90) % 360); return}
      if (S.arac == 'mobilya' || S.arac == 'tesisat' || (S.arac == 'dis' && S.disTip == 'araba')) {S.mobRot = (S.mobRot + 90) % 360; secenekCiz(); PLAN.ciz(); return}
      const o = S.secili && PLAN.nesne(S.secili); if (o && (S.secili.tur == 'mobilya' || (S.secili.tur == 'dis' && o.w != null))) {degistir(() => o.r = ((o.r || 0) + 90) % 360); return}
    }
    const m = {v: 'sec', h: 'kaydir', w: 'duvar', r: 'odarect', o: 'odabul', d: 'kapi', p: 'pencere', m: 'mobilya', a: 'arsa', l: 'dis', 'ö': 'olcu', t: 'yazi', x: 'aks', e: 'tesisat', k: 'kot', s: 'kesit'}[k];
    if (m && !e.ctrlKey && !e.metaKey && !e.altKey) aracSec(m);
  });
  document.addEventListener('keyup', e => {D3.tuslar.delete(e.key.toLowerCase()); if (e.key == 'Shift') D3.tuslar.delete('shift'); if (e.key == ' ') {PLAN.bosluk = false; aracSec(S.arac)}});
  window.addEventListener('blur', () => D3.tuslar.clear());

  const d = DEPO.oku(), son = d.son && d.projeler[d.son];
  if (son) projeAc(son); else projeDiyalog(true);
  GECMIS.dugme();
}
